          cat > docs/qa/phase15-yeki-hast-public-evidence.md <<'MD'
          # Phase 15 — YEKI HAST public-evidence and publication audit

          Internal QA record for publication discipline. The YEKI HAST repository is used only as evidence input; operational implementation details are intentionally excluded from the Holding website and from this record.

          | Public statement | Source | Supported internally? | Appropriate to publish? | Keep / Remove |
          | --- | --- | --- | --- | --- |
          | YEKI HAST is a development-stage digital product | Current YEKI HAST launch-status source | YES | YES — accurately communicates maturity without exposing engineering detail | KEEP |
          | Active build means current product-development work | Current YEKI HAST launch-status source | YES | YES — only with an explicit boundary that active build is not operating status | KEEP |
          | Product context concerns human-listening workflows and supporting application / operating systems | Current YEKI HAST repository overview and source structure | YES | YES — high-level only | KEEP |
          | Current development includes build and testing work | Current YEKI HAST launch-status source and repository test/QA structure | YES | YES — generic stage language only; no counts or implementation details | KEEP |
          | Public operation / production readiness | Current YEKI HAST launch-status source | NO | NO | REMOVE |
          | Public adoption, customer activity, transaction volume or commercial traction | Current YEKI HAST repository | NOT ESTABLISHED | NO | REMOVE |
          | Feature availability inferred from source code | Source files may contain implementation work | CODE MAY EXIST | NO — code existence does not establish public availability | REMOVE |
          | Internal infrastructure, release gates, credentials, providers or environment state | Internal engineering records | SUPPORTED INTERNALLY | NO — not corporate public proof | REMOVE |

          ## Status language

          Approved public status:

          - `SPECIALIST OPERATING VENTURE` — Evidence Axis.
          - `DEVELOPMENT-STAGE DIGITAL PRODUCT` — YEKI HAST.
          - `ACTIVE BUILD` — YEKI HAST only when explicitly defined as current development work rather than operating status.

          ## Visual provenance

          | Asset / treatment | Provenance | Public implication | Safe / Unsafe | Decision |
          | --- | --- | --- | --- | --- |
          | Inherited `.subsite-hero.tech:before` remote background | Shared legacy remote Technology treatment; asset-specific provenance not recorded for YEKI HAST | Could imply actual product interface, staff or live operating activity | UNSAFE | REMOVE FROM RENDERED VENTURES PAGE |
          | Existing `.feature-image.tech` decorative block | Shared remote Technology image treatment | Could be mistaken for an actual YEKI HAST interface or operating environment | UNSAFE | REMOVE |
          | Phase 15 status-led typography, borders and CSS geometry | Created in-repo from CSS only | Communicates maturity/status without pretending to be product proof | SAFE | KEEP |

          Phase 15 publishes no YEKI HAST screenshot, no user data, no private development artifact and no dedicated public YEKI HAST CTA.
          MD

          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/qa-site.mjs'); s=p.read_text()
          marker="\nif(errors.length){console.error('\\nTECHNICAL QA FAILED');"
          assert marker in s
          block=r'''

          // Phase 15 — Venture portfolio / YEKI HAST maturity guards.
          {
            const ventures=read('ventures.html');const venturesMain=ventures.match(/<main\b[\s\S]*?<\/main>/i)?.[0]||'';const venturesCss=read('assets/ventures.css');
            if(!ventures.includes('assets/ventures.css')||!venturesCss.startsWith('@layer page{'))errors.push('Phase 15: ventures stylesheet architecture missing');
            if((venturesMain.match(/<h1\b/gi)||[]).length!==1)errors.push('ventures.html: Phase 15 requires exactly one H1');
            for(const token of ['01 / Venture Development','STATUS-LED PORTFOLIO','02 / Portfolio Status','03 / Evidence Axis','04 / YEKI HAST','05 / Development Discipline','06 / Portfolio Context','SPECIALIST OPERATING VENTURE','DEVELOPMENT-STAGE DIGITAL PRODUCT','ACTIVE BUILD','a specialist venture within the Unique Holding portfolio','Build and Test are the current development zone','FUTURE GATE'])if(!venturesMain.includes(token))errors.push('ventures.html: Phase 15 required status/IA token missing -> '+token);
            if((venturesMain.match(/data-venture-state="operating"/g)||[]).length!==1||(venturesMain.match(/data-venture-state="development"/g)||[]).length!==1)errors.push('ventures.html: Phase 15 must expose exactly one operating and one development portfolio state');
            if((venturesMain.match(/data-stage-state="current"/g)||[]).length!==2||(venturesMain.match(/data-stage-state="future"/g)||[]).length!==2)errors.push('ventures.html: YEKI HAST current/future path semantics regression');
            const yeki=venturesMain.match(/<section class="subsite-section alt ventures-section" id="yeki-hast-status">[\s\S]*?<\/section>/i)?.[0]||'';
            for(const token of ['DEVELOPMENT-STAGE DIGITAL PRODUCT','ACTIVE BUILD','structured human-listening service workflows','current product development and testing work','Technology Context','Corporate Contact'])if(!yeki.includes(token))errors.push('ventures.html: YEKI HAST public boundary missing -> '+token);
            for(const rx of [/\blaunched\b/i,/\blive now\b/i,/\bavailable now\b/i,/\bproduction[- ]ready\b/i,/\bmarket[- ]ready\b/i,/\bactive users\b/i,/\bcommunity\b/i,/\bcustomers\b/i,/\bdownloads\b/i,/\brevenue\b/i,/\btransactions\b/i,/\btraction\b/i,/\bvalidated\b/i,/\bsuccessful launch\b/i,/\bgrowing\b/i,/\bscaled\b/i,/platform uptime/i,/global service/i,/\bmarketplace\b/i,/\bleading\b/i,/award-winning/i,/\bfunded\b/i,/\binvestment\b/i,/portfolio company/i])if(rx.test(venturesMain))errors.push('ventures.html: unsupported Phase 15 launch/traction/fund wording -> '+rx);
            for(const rx of [/\bVercel\b/i,/\bNeon\b/i,/\bSMTP\b/i,/\bOTP\b/i,/\bdatabase\b/i,/\bmigration\b/i,/\brollback\b/i,/\bGitHub\b/i,/project id/i,/\bcredential/i,/\bDB region\b/i,/\bRunner\b/i,/\btest count\b/i,/payment provider/i])if(rx.test(venturesMain))errors.push('ventures.html: private YEKI HAST engineering detail leaked -> '+rx);
            for(const rx of [/Open YEKI/i,/Try YEKI/i,/Join YEKI/i,/Download App/i,/Get Started/i,/Waitlist/i])if(rx.test(venturesMain))errors.push('ventures.html: fake YEKI HAST public CTA returned -> '+rx);
            if(/feature-image\s+tech/i.test(venturesMain)||/<img\b/i.test(venturesMain))errors.push('ventures.html: unverified/fake venture visual must not be rendered in Phase 15');
            if(!venturesCss.includes('.ventures-body .subsite-hero.tech:before{background-image:none!important'))errors.push('Phase 15: inherited remote ventures hero must be explicitly disabled');
            if(/https?:\/\/|url\s*\(/i.test(venturesCss))errors.push('assets/ventures.css: remote/image dependency forbidden');
