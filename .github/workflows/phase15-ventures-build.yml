          <header class="site-header" data-header><div class="nav-shell"><a class="brand" href="index.html" aria-label="Unique Holding home"><span class="brand-symbol" aria-hidden="true"><i></i><i></i></span><span class="sub-brand"><b>UNIQUE HOLDING</b><small>Venture Development</small></span></a><button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Open navigation"><span></span><span></span></button><nav id="primary-nav" class="primary-nav" aria-label="Primary navigation"><a href="corporate.html" data-nav-key="corporate">Corporate</a><a href="energy.html" data-nav-key="energy">Energy &amp; Trade</a><a href="technology.html" data-nav-key="technology">Technology</a><a href="ventures.html" data-nav-key="portfolio" aria-current="page">Portfolio</a><a href="contact.html" data-nav-key="contact">Contact</a><a class="sales-link nav-cta" href="sales.html" data-nav-key="sales">Industrial Sales</a></nav></div></header>
          <main id="main">
          <section class="subsite-hero tech ventures-hero" id="venture-development"><div class="inner"><p class="subsite-label">01 / Venture Development</p><p class="ventures-status-principle">STATUS-LED PORTFOLIO</p><h1>Venture<br>development.</h1><p class="intro">Unique Holding develops selected specialist ventures and digital products at different stages. This portfolio records the stage that can be supported today rather than presenting every build as an operating business.</p><div class="ventures-hero-actions"><a class="button-link primary" href="#portfolio-status">View Portfolio Status</a><a class="button-link" href="technology.html">Technology Context</a></div></div></section>

          <section class="subsite-section paper ventures-section" id="portfolio-status"><div class="section-cap"><span class="num">02 / Portfolio Status</span><h2>Different stages should look different.</h2><p>The portfolio distinguishes an operating specialist venture from a digital product still under development. Status is descriptive, not promotional.</p></div><div class="ventures-status-grid"><article class="venture-status-card venture-status-card--operating" data-venture-state="operating"><div class="venture-state-row"><span class="venture-state">SPECIALIST OPERATING VENTURE</span><span class="venture-state-note">OPERATING</span></div><h3>Evidence Axis</h3><p>Evidence Axis is a specialist venture within the Unique Holding portfolio. It operates through its own specialist brand and public website.</p><a class="text-link" href="evidence-axis.html">Evidence Axis corporate bridge <span>↗</span></a></article><article class="venture-status-card venture-status-card--development" data-venture-state="development"><div class="venture-state-row"><span class="venture-state">DEVELOPMENT-STAGE DIGITAL PRODUCT</span><span class="venture-state-note">ACTIVE BUILD</span></div><h3>YEKI HAST</h3><p>Structured human-listening service workflows and supporting product and operating systems are under active development.</p><p class="venture-boundary">Active build means current development work. It does not signal public availability or operating status.</p></article></div></section>

          <section class="subsite-section ventures-section" id="evidence-axis-status"><div class="section-cap"><span class="num">03 / Evidence Axis</span><h2>An operating specialist destination.</h2><p>Portfolio status is intentionally concise here. The approved Evidence Axis bridge carries the group relationship and routes visitors to the specialist source.</p></div><div class="venture-operating-band"><div><span>PORTFOLIO STATE</span><strong>SPECIALIST OPERATING VENTURE</strong></div><p>Evidence Axis is a specialist venture within the Unique Holding portfolio.</p><a class="button-link" href="evidence-axis.html">Open Evidence Axis Bridge</a></div></section>

          <section class="subsite-section alt ventures-section" id="yeki-hast-status"><div class="section-cap"><span class="num">04 / YEKI HAST</span><h2>A product under development.</h2><p>YEKI HAST is a development-stage digital product within the Technology &amp; Intelligence track.</p></div><div class="yeki-status-panel" aria-labelledby="yeki-status-title"><div class="yeki-status-head"><div><span>DEVELOPMENT-STAGE DIGITAL PRODUCT</span><h3 id="yeki-status-title">YEKI HAST</h3></div><strong>ACTIVE BUILD</strong></div><div class="yeki-status-body"><p>Current work is centered on structured human-listening service workflows and the product and operating systems required to develop them responsibly.</p><p class="yeki-active-definition"><b>What “active build” means here:</b> current product development and testing work. The label does not represent a public service or an operating-stage product.</p></div><div class="yeki-context-actions"><a class="button-link" href="technology.html">Technology Context</a><a class="button-link" href="contact.html">Corporate Contact</a></div></div></section>

          <section class="subsite-section paper ventures-section" id="development-discipline"><div class="section-cap"><span class="num">05 / Development Discipline</span><h2>Make the current stage explicit.</h2><p>This is an explanatory development path, not a named proprietary method and not a completion checklist.</p></div><div class="venture-path" aria-label="Explanatory venture development path"><div class="venture-path-step" data-stage-state="explanatory"><span>01</span><small>EXPLANATORY STAGE</small><h3>Problem Definition</h3><p>Frame the problem and the intended service logic.</p></div><div class="venture-path-step" data-stage-state="explanatory"><span>02</span><small>EXPLANATORY STAGE</small><h3>Research</h3><p>Test assumptions and shape the product direction.</p></div><div class="venture-path-step venture-path-step--current" data-stage-state="current"><span>03</span><small>CURRENT DEVELOPMENT</small><h3>Build</h3><p>Develop the product and supporting operating systems.</p></div><div class="venture-path-step venture-path-step--current" data-stage-state="current"><span>04</span><small>CURRENT DEVELOPMENT</small><h3>Test</h3><p>Check behavior, reliability and readiness criteria as development continues.</p></div><div class="venture-path-step venture-path-step--future" data-stage-state="future"><span>05</span><small>FUTURE GATE</small><h3>Operating Preparation</h3><p>A later stage for verified operational preparation.</p></div><div class="venture-path-step venture-path-step--future" data-stage-state="future"><span>06</span><small>FUTURE GATE</small><h3>Operation</h3><p>A later stage only after the required evidence supports that status.</p></div></div><p class="venture-path-note">For YEKI HAST, Build and Test are the current development zone. Later stages describe progression and are not presented as achieved.</p></section>

          <section class="subsite-section ventures-section ventures-context" id="portfolio-context"><div class="section-cap"><span class="num">06 / Portfolio Context</span><h2>Follow the status to the right context.</h2><p>Use the specialist bridge for Evidence Axis, the Technology route for product-development context, and corporate routes for group or business inquiries.</p></div><div class="route-grid"><a class="route-card" href="evidence-axis.html"><span class="k">Operating venture</span><h3>Evidence Axis</h3><p>Portfolio relationship and specialist-site handoff.</p><b>↗</b></a><a class="route-card" href="technology.html"><span class="k">Development context</span><h3>Technology &amp; Intelligence</h3><p>Digital product development and the wider technology track.</p><b>↗</b></a><a class="route-card" href="corporate.html"><span class="k">Group context</span><h3>Corporate Profile</h3><p>Unique Holding identity, structure and operating context.</p><b>↗</b></a><a class="route-card" href="contact.html"><span class="k">Business inquiry</span><h3>Corporate Contact</h3><p>Use the established group contact route for venture or business context.</p><b>↗</b></a></div></section>
