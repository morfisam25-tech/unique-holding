name: Phase 15 venture portfolio candidate build
on:
  push:
    branches: [phase15-ventures-build-runner]
    paths:
      - '.github/workflows/phase15-ventures-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build one-commit Phase 15 candidate
        run: |
          set -euo pipefail
          BASE=def3696a6d69b0762c9c72a765c729c481de3d57
          git config user.name "morfisam25-tech"
          git config user.email "morfisam25@gmail.com"
          git checkout -B phase15-ventures-candidate "$BASE"
          mkdir -p docs/qa

          cat > ventures.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0b"><title>Venture Development | Unique Holding</title><meta name="description" content="Venture development at Unique Holding: Evidence Axis as a specialist operating venture and YEKI HAST as a development-stage digital product under active build."><link rel="canonical" href="https://www.uniqueholding.com.tr/ventures.html"><script>document.documentElement.classList.add('js')</script><link rel="stylesheet" href="assets/site.css"><link rel="stylesheet" href="assets/internal.css"><link rel="stylesheet" href="assets/ventures.css"></head>
