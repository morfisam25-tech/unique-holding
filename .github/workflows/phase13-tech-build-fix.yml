name: Phase 13 build guard correction
on:
  push:
    branches: [phase13-tech-build-runner]
    paths:
      - '.github/workflows/phase13-tech-build-fix.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Re-run Phase 13 builder with corrected SVG guard
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/phase13-tech-build.yml').read_text().splitlines()
          start=next(i for i,l in enumerate(src) if l.strip()=='run: |')+1
          body='\n'.join((l[10:] if l.startswith('          ') else l) for l in src[start:])+'\n'
          old="if(/https?:\\/\\/|<script\\b|<image\\b[^>]*(?:href|xlink:href)=/i.test(svg))errors.push('Phase 13 SVG must not load remote/scripted content -> '+asset);"
          new="if(/<script\\b|(?:href|xlink:href)=[\\\"']https?:\\/\\//i.test(svg))errors.push('Phase 13 SVG must not load remote/scripted content -> '+asset);"
          assert old in body
          Path('/tmp/phase13-build.sh').write_text(body.replace(old,new))
          PY
          bash /tmp/phase13-build.sh
