name: Phase 22 deep live acceptance v2
on:
  push:
    branches: ["phase22-release-qa-runner"]
    paths:
      - '.github/workflows/phase22-deep-acceptance-v2.yml'
permissions:
  contents: read
  actions: read
  pages: read
jobs:
  deep:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Phase 22 QA harness
        uses: actions/checkout@v4
        with:
          ref: phase22-release-qa-runner
          path: qa22
          fetch-depth: 1
      - name: Checkout exact production candidate
        uses: actions/checkout@v4
        with:
          ref: b247b536eda5b1f48ada5b6a09c657b324d289f1
          path: candidate
          fetch-depth: 0
      - name: Recover successful live smoke screenshot interaction evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase22-review
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9921839408/zip" -o /tmp/phase22-prior.zip
          unzip -q /tmp/phase22-prior.zip -d /tmp/phase22-review
          test "$(find /tmp/phase22-review/live-spotcheck/screenshots -type f -name '*.png' | wc -l | tr -d ' ')" = 30
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('/tmp/phase22-review/live-spotcheck/phase21-spotcheck.json')
          d=json.loads(p.read_text())['summary']
          assert d['smokeCases']==32 and d['smokeFailures']==0
          assert d['spotcheckCount']==30 and d['spotcheckFailures']==0 and d['screenshotCount']==30
          assert d['interactionCases']==7 and d['interactionFailures']==0
          PY
      - name: Reconfirm immutable production state
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          test "$(git rev-parse HEAD)" = b247b536eda5b1f48ada5b6a09c657b324d289f1
          test "$(git rev-parse HEAD^{tree})" = 30a289aaf26cb1944baf76a5d9f53b98cc6e54dd
          test "$(git rev-parse HEAD^)" = 8d2811298c668865f5438f86337c9d8f9d959c80
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = b247b536eda5b1f48ada5b6a09c657b324d289f1
          test "$(git ls-remote origin refs/heads/rebuild/award-level-corporate-v2 | cut -f1)" = b247b536eda5b1f48ada5b6a09c657b324d289f1
          test -z "$(git status --porcelain)"
      - name: Refresh Pages deployment DNS evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          P=/tmp/phase22-review/reports
          mkdir -p "$P"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" > "$P/pages-raw.json"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/33818987323" > "$P/deployment-run-raw.json"
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('/tmp/phase22-review/reports')
          d=json.loads((p/'pages-raw.json').read_text()); r=json.loads((p/'deployment-run-raw.json').read_text())
          pages={k:d.get(k) for k in ['html_url','cname','build_type','source','https_enforced','https_certificate','public'] if k in d}
          dep={k:r.get(k) for k in ['id','name','head_branch','head_sha','path','event','status','conclusion','run_number','created_at','updated_at','run_started_at','html_url']}
          (p/'pages.json').write_text(json.dumps(pages,indent=2));(p/'deployment-run.json').write_text(json.dumps(dep,indent=2))
          assert pages['html_url']=='https://www.uniqueholding.com.tr/' and pages['cname']=='www.uniqueholding.com.tr' and pages['https_enforced'] is True
          cert=pages['https_certificate']; assert cert['state']=='approved' and set(cert['domains'])=={'www.uniqueholding.com.tr','uniqueholding.com.tr'}
          assert dep['id']==33818987323 and dep['head_sha']=='b247b536eda5b1f48ada5b6a09c657b324d289f1' and dep['conclusion']=='success'
          PY
          rm "$P/pages-raw.json" "$P/deployment-run-raw.json"
          : > "$P/dns.txt"
          for server in 8.8.8.8 1.1.1.1; do
            echo "### resolver=$server www CNAME" >> "$P/dns.txt"; dig +short @$server www.uniqueholding.com.tr CNAME >> "$P/dns.txt"
            echo "### resolver=$server apex A" >> "$P/dns.txt"; dig +short @$server uniqueholding.com.tr A | sort >> "$P/dns.txt"
          done
      - name: Install deep live browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase22-node
          cd /tmp/phase22-node
          npm init -y >/dev/null 2>&1
          npm install --no-save --ignore-scripts puppeteer-core@24.16.0 >/dev/null
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$CHROME"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
      - name: Deep live TLS fingerprint SEO film catalog and security checks
        shell: bash
        run: |
          set -euo pipefail
          cp qa22/.github/phase22/live_release.cjs /tmp/phase22-live-release-fixed.cjs
          sed -i 's/resp?Object.fromEntries(resp.headers()):{}/resp?resp.headers():{}/' /tmp/phase22-live-release-fixed.cjs
          PHASE22_CANDIDATE="$GITHUB_WORKSPACE/candidate" \
          PHASE22_OUT='/tmp/phase22-review/live' \
          NODE_PATH='/tmp/phase22-node/node_modules' CHROME="$CHROME" \
            node /tmp/phase22-live-release-fixed.cjs | tee /tmp/phase22-review/reports/live-deep-console.log
      - name: Build combined automated acceptance manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          P=pathlib.Path('/tmp/phase22-review')
          live=json.loads((P/'live/summary.json').read_text()); spot=json.loads((P/'live-spotcheck/phase21-spotcheck.json').read_text())['summary']
          pages=json.loads((P/'reports/pages.json').read_text()); dep=json.loads((P/'reports/deployment-run.json').read_text())
          assert live['totalErrors']==0,live['errors']; assert spot['smokeCases']==32 and spot['smokeFailures']==0
          assert spot['spotcheckCount']==30 and spot['spotcheckFailures']==0 and spot['screenshotCount']==30
          assert spot['interactionCases']==7 and spot['interactionFailures']==0
          m={'status':'AUTOMATED LIVE ACCEPTANCE PASS — MANUAL VISUAL REVIEW PENDING','releaseCandidateSha':'b247b536eda5b1f48ada5b6a09c657b324d289f1','releaseCandidateTree':'30a289aaf26cb1944baf76a5d9f53b98cc6e54dd','main':'b247b536eda5b1f48ada5b6a09c657b324d289f1','rebuild':'b247b536eda5b1f48ada5b6a09c657b324d289f1','productionSha':dep['head_sha'],'deploymentRun':dep['id'],'productionUrl':pages['html_url'],'httpsEnforced':pages['https_enforced'],'certificate':pages['https_certificate'],'routeSmoke':{'cases':32,'failures':0},'liveVisuals':{'captured':30,'automatedFailures':0,'manualReview':'PENDING'},'interactions':{'cases':7,'failures':0},'seo':{'routes':live['routeSurface'],'indexable':live['indexable'],'noindex':live['noindex'],'sitemap':live['sitemap']},'counts':live['liveCounts'],'filmPass':live['filmPass'],'mixedContentRequests':live['mixedContentRequests'],'criticalSameOriginNetworkFailures':live['criticalSameOriginNetworkFailures'],'totalAutomatedErrors':live['totalErrors']}
          (P/'phase22-automated-manifest.json').write_text(json.dumps(m,indent=2,ensure_ascii=False))
          (P/'PHASE_22_LIVE_EVIDENCE_PRELIMINARY.md').write_text(f'''# PHASE 22 — LIVE PRODUCTION EVIDENCE\n\n**AUTOMATED LIVE ACCEPTANCE: PASS**\n\nManual inspection of the 30 actual production screenshots is the only remaining visual evidence step before the final release packet.\n\nProduction SHA: `{m['productionSha']}`\n\nProduction URL: `{m['productionUrl']}`\n\nDeployment run: `{m['deploymentRun']}`\n\nHTTPS enforced: `{m['httpsEnforced']}` — certificate `{m['certificate'].get('state')}`\n\nRoute smoke: 32/32 PASS\n\nLive screenshots: 30/30 captured; automated failures 0\n\nInteractions: 7/7 PASS\n\nSEO: {m['seo']['routes']} routes / {m['seo']['indexable']} indexable / {m['seo']['noindex']} noindex / {m['seo']['sitemap']} sitemap URLs\n\nProduct counts: {m['counts']['core']} / {m['counts']['inquiry']} / {m['counts']['invalid']}\n\nFilm production regression: PASS\n\nMixed-content requests: {m['mixedContentRequests']}\n\nCritical same-origin network failures: {m['criticalSameOriginNetworkFailures']}\n''')
          PY
          (cd /tmp/phase22-review && rm -f SHA256SUMS.txt && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Upload combined automated Phase 22 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase22-live-production-evidence-v2
          path: /tmp/phase22-review/
          if-no-files-found: error
          compression-level: 6
