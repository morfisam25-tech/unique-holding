name: Phase 17 policy visual diagnostic
on:
  push:
    branches: [phase17-privacy-qa-runner]
    paths: ['.github/workflows/phase17-policy-debug.yml']
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare immutable diagnostic
        run: |
          cp .github/phase17/phase17-policy-debug.cjs /tmp/phase17-policy-debug.cjs
          git checkout --force db2e8b9134f7bac4b825bc5ac07301f19499237e
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          npm install --no-save --ignore-scripts puppeteer-core@24.16.0
      - name: Run targeted 10-case policy diagnostic
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          NODE_PATH="$PWD/node_modules" CHROME="$CHROME" node /tmp/phase17-policy-debug.cjs
