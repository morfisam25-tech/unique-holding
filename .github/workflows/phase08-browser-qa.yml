name: Phase 08 browser visual QA

on:
  push:
    branches:
      - phase08-browser-qa-runner

permissions:
  contents: read

jobs:
  render-energy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Phase 08 snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable product snapshot
        shell: bash
        run: |
          git merge-base --is-ancestor 4ca464131e2e0d3ce2ba98aeda385c5d6162f34f HEAD
          test "$(git diff --name-only 4ca464131e2e0d3ce2ba98aeda385c5d6162f34f..HEAD | sort)" = ".github/workflows/phase08-browser-qa.yml"

      - name: Install browser driver only
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          npm install --no-save --ignore-scripts puppeteer-core@24.16.0

      - name: Render Energy page at five exact required viewports
        shell: bash
        run: |
          mkdir -p phase08-browser-qa
          python3 -m http.server 8000 --bind 127.0.0.1 >phase08-browser-qa/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat > /tmp/phase08-browser-qa.cjs <<'NODE'
          const fs = require('fs');
          const puppeteer = require('puppeteer-core');

          const cases = [
            {name:'1920x1080', width:1920, height:1080},
            {name:'1440x900', width:1440, height:900},
            {name:'768x1024', width:768, height:1024},
            {name:'390x844', width:390, height:844},
            {name:'360x800', width:360, height:800}
          ];

          async function settle(ms=350){ return new Promise(r => setTimeout(r, ms)); }

          async function sweepLazy(page){
            await page.evaluate(async () => {
              await new Promise(resolve => {
                let y = 0;
                const step = 650;
                const tick = () => {
                  const max = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
                  y += step;
                  window.scrollTo(0, Math.min(y, max));
                  if (y >= max) {
                    setTimeout(() => { window.scrollTo(0, 0); resolve(); }, 350);
                  } else {
                    setTimeout(tick, 90);
                  }
                };
                tick();
              });
            });
          }

          async function captureAt(page, caseName, label, selector=null){
            if(selector){
              await page.evaluate(sel => {
                const el=document.querySelector(sel);
                if(!el) throw new Error(`Missing screenshot target ${sel}`);
                el.scrollIntoView({block:'center', inline:'nearest'});
              }, selector);
            } else {
              await page.evaluate(() => window.scrollTo(0,0));
            }
            await settle(450);
            await page.screenshot({path:`phase08-browser-qa/energy-${caseName}-${label}.png`});
          }

          (async () => {
            const browser = await puppeteer.launch({
              headless: true,
              executablePath: process.env.CHROME,
              args: ['--no-sandbox','--disable-dev-shm-usage']
            });
            const report = {sha:'4ca464131e2e0d3ce2ba98aeda385c5d6162f34f', cases:{}};

            for (const c of cases) {
              const page = await browser.newPage();
              const consoleErrors = [];
              const pageErrors = [];
              const requestFailures = [];
              page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
              page.on('pageerror', err => pageErrors.push(String(err)));
              page.on('requestfailed', req => requestFailures.push({url:req.url(), error:req.failure()?.errorText || ''}));
              await page.setViewport({width:c.width,height:c.height,deviceScaleFactor:1});
              const response = await page.goto('http://127.0.0.1:8000/energy.html',{waitUntil:'networkidle0',timeout:30000});
              await page.evaluate(() => document.fonts?.ready || Promise.resolve());
              await captureAt(page,c.name,'hero');
              await sweepLazy(page);
              await settle(500);

              const metrics = await page.evaluate(() => {
                const vw = document.documentElement.clientWidth;
                const overflow = [];
                for (const el of document.querySelectorAll('body *')) {
                  const s = getComputedStyle(el);
                  if (s.position === 'fixed' || s.position === 'sticky') continue;
                  const r = el.getBoundingClientRect();
                  if (!r.width || !r.height) continue;
                  if (r.right > vw + 2 || r.left < -2) {
                    overflow.push({
                      tag: el.tagName.toLowerCase(),
                      id: el.id || '',
                      class: typeof el.className === 'string' ? el.className : '',
                      left: Math.round(r.left), right: Math.round(r.right), width: Math.round(r.width)
                    });
                    if (overflow.length >= 30) break;
                  }
                }
                const images = [...document.images].map(img => ({
                  src: img.getAttribute('src') || '',
                  complete: img.complete,
                  naturalWidth: img.naturalWidth,
                  naturalHeight: img.naturalHeight,
                  renderedWidth: Math.round(img.getBoundingClientRect().width),
                  renderedHeight: Math.round(img.getBoundingClientRect().height)
                }));
                const sections = [...document.querySelectorAll('main > section, main > figure')].map(el => {
                  const r = el.getBoundingClientRect();
                  return {tag:el.tagName.toLowerCase(), class:el.className || '', top:Math.round(r.top + scrollY), height:Math.round(r.height)};
                });
                const nav = document.querySelector('#primary-nav');
                const header = document.querySelector('[data-header]');
                const targets = {};
                for (const sel of ['.energy-visual-moment--film','.energy-flow','.energy-core','.energy-context','.energy-visual-moment--operations','.energy-rfq']) {
                  const el=document.querySelector(sel);
                  targets[sel]=el ? {exists:true, width:Math.round(el.getBoundingClientRect().width), height:Math.round(el.getBoundingClientRect().height)} : {exists:false};
                }
                return {
                  viewportWidth: vw,
                  viewportHeight: innerHeight,
                  scrollWidth: document.documentElement.scrollWidth,
                  scrollHeight: document.documentElement.scrollHeight,
                  horizontalOverflow: document.documentElement.scrollWidth > vw + 2,
                  overflow,
                  images,
                  sections,
                  header:{exists:!!header, width:header?Math.round(header.getBoundingClientRect().width):0},
                  nav:{exists:!!nav, width:nav?Math.round(nav.getBoundingClientRect().width):0, ariaHidden:nav?.getAttribute('aria-hidden') || null},
                  targets
                };
              });

              report.cases[c.name] = {
                status: response?.status() || null,
                ...metrics,
                consoleErrors,
                pageErrors,
                requestFailures
              };

              await captureAt(page,c.name,'film','.energy-visual-moment--film');
              await captureAt(page,c.name,'flow','.energy-flow');
              await captureAt(page,c.name,'core','.energy-core');
              await captureAt(page,c.name,'context','.energy-context');
              await captureAt(page,c.name,'operations','.energy-visual-moment--operations');
              await captureAt(page,c.name,'rfq','.energy-rfq');
              await captureAt(page,c.name,'hero');
              await page.screenshot({path:`phase08-browser-qa/energy-${c.name}-full.png`,fullPage:true});
              await page.close();
            }
            fs.writeFileSync('phase08-browser-qa/report.json', JSON.stringify(report,null,2));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          NODE_PATH="$PWD/node_modules" node /tmp/phase08-browser-qa.cjs
          cat phase08-browser-qa/report.json

      - name: Enforce browser sanity gates
        shell: bash
        run: |
          node <<'NODE'
          const r=require('./phase08-browser-qa/report.json');
          const required=['1920x1080','1440x900','768x1024','390x844','360x800'];
          if(JSON.stringify(Object.keys(r.cases))!==JSON.stringify(required)) throw new Error(`Exact viewport matrix mismatch: ${Object.keys(r.cases)}`);
          for(const [name,c] of Object.entries(r.cases)){
            if(![200,304].includes(c.status)) throw new Error(`${name}: HTTP ${c.status}`);
            if(c.horizontalOverflow) throw new Error(`${name}: horizontal overflow ${c.scrollWidth}/${c.viewportWidth}`);
            const broken=c.images.filter(i=>!i.complete||i.naturalWidth<1||i.naturalHeight<1);
            if(broken.length) throw new Error(`${name}: broken images ${JSON.stringify(broken)}`);
            const phase08Images=c.images.filter(i=>i.src.includes('assets/phase08/'));
            if(phase08Images.length!==2) throw new Error(`${name}: expected exactly two Phase 08 images, found ${phase08Images.length}`);
            if(c.pageErrors.length) throw new Error(`${name}: page errors ${JSON.stringify(c.pageErrors)}`);
            if(c.consoleErrors.length) throw new Error(`${name}: console errors ${JSON.stringify(c.consoleErrors)}`);
            if(c.requestFailures.length) throw new Error(`${name}: request failures ${JSON.stringify(c.requestFailures)}`);
            if(!c.header.exists||!c.nav.exists) throw new Error(`${name}: header/nav missing`);
            for(const [sel,t] of Object.entries(c.targets)) if(!t.exists) throw new Error(`${name}: missing required target ${sel}`);
          }
          console.log('PHASE08_EXACT_VIEWPORT_MATRIX_PASS');
          NODE

      - name: Upload browser QA packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase08-browser-qa-exact-matrix
          path: phase08-browser-qa/
          if-no-files-found: error
