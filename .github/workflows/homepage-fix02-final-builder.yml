name: Homepage Fix 02 Live Production Verify

on:
  push:
    branches:
      - ops/homepage-fix02-centerm-final-builder

permissions:
  contents: read

jobs:
  live-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production HTTP assets
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL='https://www.uniqueholding.com.tr'
          mkdir -p /tmp/live-verify
          curl --retry 8 --retry-delay 2 --retry-all-errors -fSsL "$BASE_URL/" -o /tmp/live-verify/index.html
          curl --retry 8 --retry-delay 2 --retry-all-errors -fSsL "$BASE_URL/legal.html" -o /tmp/live-verify/legal.html
          curl --retry 8 --retry-delay 2 --retry-all-errors -fSsL "$BASE_URL/energy.html" -o /tmp/live-verify/energy.html
          curl --retry 8 --retry-delay 2 --retry-all-errors -fSsL "$BASE_URL/assets/homepage/centerm-night-trade.webp" -o /tmp/live-verify/centerm-night-trade.webp

          test "$(sha256sum /tmp/live-verify/centerm-night-trade.webp | awk '{print $1}')" = 'e3cdb7cfcb56f6945c67edcf15a970e6d0728fc8364eb66925baf88c3c0434cb'
          test "$(stat -c%s /tmp/live-verify/centerm-night-trade.webp)" = '394588'
          grep -q 'assets/homepage/centerm-night-trade.webp' /tmp/live-verify/index.html
          ! grep -q 'assets/phase08/film-still-physical-trade.webp' /tmp/live-verify/index.html
          ! grep -q 'homepage-hero-positioning.css' /tmp/live-verify/index.html
          grep -q 'assets/phase08/film-still-physical-trade.webp' /tmp/live-verify/energy.html
          grep -q 'Centerm at night as seen from Canada Place' /tmp/live-verify/legal.html
          grep -q 'Dllu' /tmp/live-verify/legal.html
          grep -q 'creativecommons.org/licenses/by-sa/4.0/' /tmp/live-verify/legal.html

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/live-verify
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Live browser QA 1440 and 390
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/live-verify/live-qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const base='https://www.uniqueholding.com.tr';
          const browser=await chromium.launch({headless:true});
          const cases=[['1440',1440,900],['390',390,844]];
          const report={failures:[],viewports:{},energy:{},legal:{},asset:{}};

          for(const [name,width,height] of cases){
            const context=await browser.newContext({viewport:{width,height},ignoreHTTPSErrors:false,reducedMotion:'reduce'});
            const page=await context.newPage();
            const consoleErrors=[]; const pageErrors=[]; const failed=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('requestfailed',r=>failed.push({url:r.url(),error:r.failure()?.errorText||''}));

            const nav=await page.goto(base+'/',{waitUntil:'domcontentloaded',timeout:45000});
            if(!nav||nav.status()!==200)report.failures.push(`${name}: homepage HTTP ${nav?.status()}`);
            await page.waitForTimeout(2200);

            const state=await page.evaluate(()=>{
              const img=document.querySelector('.home-operating-world--trade .home-world-media img');
              const video=document.querySelector('#holding-film');
              const source=video?.querySelector('source');
              return {
                tradeSrc:img?.getAttribute('src')||'',
                tradeComplete:img?.complete||false,
                tradeNaturalWidth:img?.naturalWidth||0,
                tradeNaturalHeight:img?.naturalHeight||0,
                tradeWidthAttr:img?.getAttribute('width')||'',
                tradeHeightAttr:img?.getAttribute('height')||'',
                horizontalOverflow:document.documentElement.scrollWidth>document.documentElement.clientWidth,
                brokenImages:[...document.images].filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.getAttribute('src')),
                mixedContent:[...performance.getEntriesByType('resource')].map(e=>e.name).filter(u=>u.startsWith('http://')),
                fix01Styles:[...document.querySelectorAll('link[rel="stylesheet"]')].map(x=>x.getAttribute('href')||'').filter(x=>x.includes('homepage-hero-positioning.css')),
                heroVideoSrc:source?.getAttribute('src')||video?.getAttribute('src')||'',
                heroExists:!!video
              };
            });

            if(state.tradeSrc!=='assets/homepage/centerm-night-trade.webp')report.failures.push(`${name}: homepage trade src mismatch`);
            if(!state.tradeComplete||state.tradeNaturalWidth!==2400||state.tradeNaturalHeight!==1350)report.failures.push(`${name}: homepage trade load/dimensions mismatch`);
            if(state.tradeWidthAttr!=='960'||state.tradeHeightAttr!=='540')report.failures.push(`${name}: homepage trade layout attributes changed`);
            if(state.horizontalOverflow)report.failures.push(`${name}: horizontal overflow`);
            if(state.brokenImages.length)report.failures.push(`${name}: broken images ${state.brokenImages.join(',')}`);
            if(state.mixedContent.length)report.failures.push(`${name}: mixed content ${state.mixedContent.join(',')}`);
            if(state.fix01Styles.length)report.failures.push(`${name}: rejected Fix 01 stylesheet returned`);
            if(!state.heroExists||state.heroVideoSrc!=='assets/media/unique-holding-film-720p.mp4')report.failures.push(`${name}: protected hero film source changed`);
            if(consoleErrors.length)report.failures.push(`${name}: console errors ${consoleErrors.join(' | ')}`);
            if(pageErrors.length)report.failures.push(`${name}: page errors ${pageErrors.join(' | ')}`);
            const unexpectedFailed=failed.filter(x=>!x.url.includes('unique-holding-film-720p.mp4'));
            if(unexpectedFailed.length)report.failures.push(`${name}: failed requests ${JSON.stringify(unexpectedFailed)}`);

            await page.screenshot({path:`/tmp/live-verify/live-home-${name}.png`,fullPage:false});
            const section=page.locator('.home-operating-world--trade');
            await section.scrollIntoViewIfNeeded();
            await page.waitForTimeout(300);
            await section.screenshot({path:`/tmp/live-verify/live-energy-section-${name}.png`});

            report.viewports[name]={state,consoleErrors,pageErrors,failedRequests:unexpectedFailed};
            await context.close();
          }

          {
            const context=await browser.newContext({viewport:{width:1440,height:900},ignoreHTTPSErrors:false,reducedMotion:'reduce'});
            const page=await context.newPage();
            const consoleErrors=[]; const pageErrors=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            const nav=await page.goto(base+'/energy.html',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForTimeout(1200);
            const state=await page.evaluate(()=>{
              const img=document.querySelector('.energy-visual-moment--film img');
              return {
                src:img?.getAttribute('src')||'',
                complete:img?.complete||false,
                naturalWidth:img?.naturalWidth||0,
                naturalHeight:img?.naturalHeight||0,
                brokenImages:[...document.images].filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.getAttribute('src')),
                mixedContent:[...performance.getEntriesByType('resource')].map(e=>e.name).filter(u=>u.startsWith('http://')),
                overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth
              };
            });
            if(!nav||nav.status()!==200)report.failures.push(`energy.html HTTP ${nav?.status()}`);
            if(state.src!=='assets/phase08/film-still-physical-trade.webp'||!state.complete||state.naturalWidth!==960||state.naturalHeight!==540)report.failures.push('energy.html Phase 08 image contract failed');
            if(state.brokenImages.length||state.mixedContent.length||state.overflow||consoleErrors.length||pageErrors.length)report.failures.push('energy.html browser integrity failed');
            report.energy={state,consoleErrors,pageErrors};
            await context.close();
          }

          {
            const context=await browser.newContext({viewport:{width:1440,height:900},ignoreHTTPSErrors:false});
            const page=await context.newPage();
            const consoleErrors=[]; const pageErrors=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            const nav=await page.goto(base+'/legal.html',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForTimeout(600);
            const text=await page.locator('body').innerText();
            const state={
              attribution:text.includes('Centerm at night as seen from Canada Place')&&text.includes('Dllu')&&text.includes('CC BY-SA 4.0'),
              mixedContent:await page.evaluate(()=>[...performance.getEntriesByType('resource')].map(e=>e.name).filter(u=>u.startsWith('http://')))
            };
            if(!nav||nav.status()!==200)report.failures.push(`legal.html HTTP ${nav?.status()}`);
            if(!state.attribution)report.failures.push('legal attribution missing');
            if(state.mixedContent.length||consoleErrors.length||pageErrors.length)report.failures.push('legal.html browser integrity failed');
            report.legal={state,consoleErrors,pageErrors};
            await context.close();
          }

          {
            const request=await browser.newContext({ignoreHTTPSErrors:false});
            const response=await request.request.get(base+'/assets/homepage/centerm-night-trade.webp');
            report.asset={status:response.status(),contentType:response.headers()['content-type']||''};
            if(response.status()!==200)report.failures.push(`Centerm asset HTTP ${response.status()}`);
            await request.close();
          }

          await browser.close();
          fs.writeFileSync('/tmp/live-verify/live-qa.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if(report.failures.length)process.exit(1);
          JS
          cd /tmp/live-verify
          node live-qa.mjs

      - name: Upload live evidence
        uses: actions/upload-artifact@v4
        with:
          name: homepage-fix02-live-production-evidence
          path: |
            /tmp/live-verify/live-qa.json
            /tmp/live-verify/live-home-1440.png
            /tmp/live-verify/live-home-390.png
            /tmp/live-verify/live-energy-section-1440.png
            /tmp/live-verify/live-energy-section-390.png
