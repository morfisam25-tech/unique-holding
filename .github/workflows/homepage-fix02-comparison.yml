name: Homepage Fix 02 precommit comparison

on:
  push:
    branches: ["homepage-fix02-source-audit"]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production baseline
        uses: actions/checkout@v4
        with:
          ref: 46190b02d6760d5c3e59d042535479636c2f2b9a
      - name: Install image tools
        run: python3 -m pip install --quiet pillow numpy
      - name: Download provenance-safe candidates
        run: |
          set -euo pipefail
          mkdir -p fix02-comparison/source
          cp assets/phase08/film-still-physical-trade.webp fix02-comparison/source/A-current.webp
          curl -fL --retry 3 -o fix02-comparison/source/B-botlek-cc0.jpg 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Botlek_Tank_Terminal%2C_Port_of_Rotterdam_pic1.JPG'
          curl -fL --retry 3 -o fix02-comparison/source/C-port-arthur-cc0.jpg 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Crude_Oil_Tanker_in_Port_Arthur%2C_Texas.jpg'
          curl -fL --retry 3 -o fix02-comparison/source/D-preemraff-quality.jpg 'https://upload.wikimedia.org/wikipedia/commons/a/a1/Product_terminal_at_Preemraff_Lysekil_with_tankers.jpg'
      - name: Build comparison sheet and metrics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageOps,ImageDraw
          import numpy as np, json
          root=Path('fix02-comparison')
          items=[
            ('A — CURRENT','source/A-current.webp','Current Phase 23 film still / internal approved asset'),
            ('B — BOTLEK CC0','source/B-botlek-cc0.jpg','Botlek Tank Terminal, Port of Rotterdam — Alf van Beem — Own work — CC0 1.0 — source 4608×2592'),
            ('C — PORT ARTHUR CC0','source/C-port-arthur-cc0.jpg','Crude Oil Tanker in Port Arthur passing LNG facility — Quintin Soloviev — Own work — CC0 1.0 — source 8064×5858'),
            ('D — PREEMRAFF QUALITY','source/D-preemraff-quality.jpg','Product terminal at Preemraff Lysekil with tankers — W.carter — Own work — CC BY-SA 4.0 — Wikimedia Commons Quality image — source 4764×3136')]
          def sharp(im):
            g=np.asarray(ImageOps.grayscale(im),dtype=np.float32)
            if max(g.shape)>1800:
              scale=1800/max(g.shape)
              g=np.asarray(ImageOps.grayscale(im).resize((int(im.width*scale),int(im.height*scale)),Image.Resampling.LANCZOS),dtype=np.float32)
            lap=-4*g+np.roll(g,1,0)+np.roll(g,-1,0)+np.roll(g,1,1)+np.roll(g,-1,1)
            return float(lap.var())
          metrics=[]; W=2600; fullw=1700; fullh=956; detail=620; pad=70; labelh=150; rowh=fullh+labelh+pad
          sheet=Image.new('RGB',(W,pad+rowh*len(items)),(238,235,228)); d=ImageDraw.Draw(sheet)
          for i,(label,path,prov) in enumerate(items):
            p=root/path; im=Image.open(p).convert('RGB'); y=pad+i*rowh
            fit=ImageOps.fit(im,(fullw,fullh),method=Image.Resampling.LANCZOS,centering=(.5,.5)); sheet.paste(fit,(pad,y))
            crop_side=min(im.width,im.height,1200); cx=int(im.width*.55); cy=int(im.height*.55)
            l=max(0,min(im.width-crop_side,cx-crop_side//2)); t=max(0,min(im.height-crop_side,cy-crop_side//2))
            crop=im.crop((l,t,l+crop_side,t+crop_side)).resize((detail,detail),Image.Resampling.LANCZOS); sheet.paste(crop,(pad+fullw+70,y+30))
            s=sharp(im); metrics.append({'label':label,'file':path,'width':im.width,'height':im.height,'bytes':p.stat().st_size,'sharpness_metric':round(s,2),'provenance':prov})
            d.text((pad,y+fullh+20),f'{label}  |  {im.width}×{im.height}  |  {p.stat().st_size:,} bytes  |  sharpness metric {s:.1f}',fill=(18,18,18))
            d.text((pad,y+fullh+58),prov,fill=(70,70,70)); d.text((pad+fullw+70,y+detail+45),'DETAIL CROP',fill=(80,80,80))
          sheet.save(root/'HOMEPAGE_FIX_02_PRECOMMIT_COMPARISON.jpg','JPEG',quality=94,subsampling=0)
          (root/'comparison-metrics.json').write_text(json.dumps(metrics,indent=2))
          PY
      - name: Upload comparison
        uses: actions/upload-artifact@v4
        with:
          name: homepage-fix02-precommit-comparison-final-options
          path: fix02-comparison/
          if-no-files-found: error
