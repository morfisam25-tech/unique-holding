name: Phase 22 final artifact packaging
on:
  push:
    branches: ["phase22-release-qa-runner"]
    paths:
      - '.github/workflows/phase22-finalize-release.yml'
permissions:
  contents: read
  actions: read
  pages: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout QA packaging branch
        uses: actions/checkout@v4
        with:
          ref: phase22-release-qa-runner
          path: qa22
          fetch-depth: 1
      - name: Checkout exact frozen production candidate
        uses: actions/checkout@v4
        with:
          ref: b247b536eda5b1f48ada5b6a09c657b324d289f1
          path: candidate
          fetch-depth: 0
      - name: Build and internally verify final release packet
        env:
          GH_TOKEN: ${{ github.token }}
          QA22_DIR: qa22
          CANDIDATE_DIR: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 qa22/.github/phase22-packaging/finalize_packet.py
      - name: Upload exactly one final artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase22-production-release-packet-final
          path: /tmp/phase22-final/
          if-no-files-found: error
          compression-level: 6
