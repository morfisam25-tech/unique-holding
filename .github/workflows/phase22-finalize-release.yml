name: Phase 22 finalize production release packet
on:
  push:
    branches: ["phase22-release-qa-runner"]
    paths:
      - '.github/workflows/phase22-finalize-release.yml'
permissions:
  contents: write
  actions: read
  pages: read
jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Phase 22 QA evidence
        uses: actions/checkout@v4
        with:
          ref: phase22-release-qa-runner
          path: qa22
          fetch-depth: 1
      - name: Download exact live evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase22-final
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9921975696/zip" -o /tmp/source.zip
          unzip -q /tmp/source.zip -d /tmp/phase22-final
          rm -f /tmp/phase22-final/SHA256SUMS.txt /tmp/phase22-final/live/fatal.txt
          cp qa22/.github/phase22/manual_visual_review.md /tmp/phase22-final/MANUAL_LIVE_VISUAL_REVIEW.md
      - name: Validate all accepted live evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,re
          P=pathlib.Path('/tmp/phase22-final')
          live=json.loads((P/'live/summary.json').read_text())
          spot=json.loads((P/'live-spotcheck/phase21-spotcheck.json').read_text())['summary']
          pages=json.loads((P/'reports/pages.json').read_text())
          dep=json.loads((P/'reports/deployment-run.json').read_text())
          film=json.loads((P/'live/film.json').read_text())
          seo=json.loads((P/'live/seo-network.json').read_text())
          counts=json.loads((P/'live/product-counts.json').read_text())
          fps=json.loads((P/'live/fingerprints.json').read_text())
          manual=(P/'MANUAL_LIVE_VISUAL_REVIEW.md').read_text()
          shots=sorted(x.name for x in (P/'live-spotcheck/screenshots').glob('*.png'))
          reviewed=sorted(re.findall(r'PASS — ([^\n]+\.png)',manual))
          assert len(shots)==30 and reviewed==shots, (len(shots),len(reviewed))
          assert 'Result: **30 / 30 PASS**' in manual
          assert live['productionSha']=='b247b536eda5b1f48ada5b6a09c657b324d289f1'
          assert live['productionTree']=='30a289aaf26cb1944baf76a5d9f53b98cc6e54dd'
          assert live['tlsPass'] and live['redirectPass'] and live['totalErrors']==0 and live['errors']==[]
          assert live['fingerprintFailures']==0 and live['fingerprintCount']==23
          assert live['routeSurface']==16 and live['indexable']==14 and live['noindex']==2 and live['sitemap']==14
          assert live['liveCounts']=={'core':3,'inquiry':62,'invalid':0}
          assert live['filmPass'] and live['criticalSameOriginNetworkFailures']==0 and live['mixedContentRequests']==0 and live['pageErrorContexts']==0
          assert spot['smokeCases']==32 and spot['smokeFailures']==0
          assert spot['spotcheckCount']==30 and spot['spotcheckFailures']==0 and spot['screenshotCount']==30
          assert spot['interactionCases']==7 and spot['interactionFailures']==0 and spot['externalFailureEvents']==0
          assert pages['html_url']=='https://www.uniqueholding.com.tr/' and pages['cname']=='www.uniqueholding.com.tr' and pages['https_enforced'] is True
          assert pages['source']=={'branch':'main','path':'/'} and pages['build_type']=='workflow'
          cert=pages['https_certificate']; assert cert['state']=='approved' and set(cert['domains'])=={'www.uniqueholding.com.tr','uniqueholding.com.tr'}
          assert dep['id']==33818987323 and dep['head_sha']=='b247b536eda5b1f48ada5b6a09c657b324d289f1' and dep['conclusion']=='success'
          assert film['pass'] and film['priorRealDeviceApproval']=='CARRIED FORWARD' and film['phase19FilmPerformance001']=='ACCEPTED PROTECTED LIMITATION — NOT A RELEASE BLOCKER' and film['posterOptimizedClaimed'] is False
          assert counts['core']==3 and counts['inquiry']==62 and counts['invalid']==0
          assert len(fps)==23 and all(x['match'] for x in fps)
          assert len(seo['rows'])==16 and seo['indexable']==14 and seo['noindex']==2 and seo['jsonLdEntities']==19 and seo['sitemapCount']==14 and len(seo['socialAssets'])==5
          assert all(not x['pageErrors'] and not x['httpRequests'] and not x['sameOriginBad'] for x in seo['rows'])
          print('PHASE22 ALL ACCEPTED LIVE EVIDENCE VALIDATED')
          PY
          (cd /tmp/phase22-final/live-spotcheck/screenshots && sha256sum *.png | sort) > /tmp/phase22-final/reports/live-screenshot-sha256.txt
      - name: Verify final repository and Pages readback
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          P=/tmp/phase22-final/reports
          MAIN="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)"
          REBUILD="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/rebuild/award-level-corporate-v2 | cut -f1)"
          test "$MAIN" = b247b536eda5b1f48ada5b6a09c657b324d289f1
          test "$REBUILD" = b247b536eda5b1f48ada5b6a09c657b324d289f1
          printf 'MAIN=%s\nREBUILD=%s\n' "$MAIN" "$REBUILD" > "$P/final-branch-readback.txt"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" > /tmp/pages-final.json
          python3 - <<'PY'
          import json,pathlib
          d=json.load(open('/tmp/pages-final.json')); p=pathlib.Path('/tmp/phase22-final/reports')
          keep={k:d.get(k) for k in ['html_url','cname','build_type','source','https_enforced','https_certificate','public'] if k in d}
          assert keep['html_url']=='https://www.uniqueholding.com.tr/' and keep['https_enforced'] is True and keep['https_certificate']['state']=='approved'
          (p/'pages-final-readback.json').write_text(json.dumps(keep,indent=2))
          PY
      - name: Remove only known temporary no-op branch if safe
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          P=/tmp/phase22-final/reports/temporary-branch-residue.txt
          BRANCH='__noop_should_not_create'
          EXPECTED='b247b536eda5b1f48ada5b6a09c657b324d289f1'
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          current="$(git ls-remote "$remote" "refs/heads/$BRANCH" | cut -f1)"
          if [ -z "$current" ]; then
            printf 'TEMPORARY_BRANCH=%s\nSTATUS=DELETED_OR_ABSENT\nPRODUCT_BLOCKER=NO\n' "$BRANCH" > "$P"
          elif [ "$current" != "$EXPECTED" ]; then
            printf 'TEMPORARY_BRANCH=%s\nSHA=%s\nSTATUS=NOT_DELETED_SAFETY_SHA_MISMATCH\nPRODUCT_BLOCKER=NO\n' "$BRANCH" "$current" > "$P"
          else
            if git push "$remote" --delete "$BRANCH" >/tmp/delete.out 2>/tmp/delete.err; then
              after="$(git ls-remote "$remote" "refs/heads/$BRANCH" | cut -f1)"
              if [ -z "$after" ]; then
                printf 'TEMPORARY_BRANCH=%s\nPRE_DELETE_SHA=%s\nSTATUS=DELETED_AND_VERIFIED\nPRODUCT_BLOCKER=NO\n' "$BRANCH" "$current" > "$P"
              else
                printf 'TEMPORARY_BRANCH=%s\nSHA=%s\nSTATUS=DELETE_ATTEMPTED_BUT_STILL_PRESENT\nPRODUCT_BLOCKER=NO\n' "$BRANCH" "$after" > "$P"
              fi
            else
              msg="$(tr '\n' ' ' </tmp/delete.err | sed 's#x-access-token:[^@]*@#x-access-token:REDACTED@#g')"
              printf 'TEMPORARY_BRANCH=%s\nSHA=%s\nSTATUS=NON-PRODUCT REPOSITORY HYGIENE RESIDUE\nDELETE_RESULT=%s\nPRODUCT_BLOCKER=NO\n' "$BRANCH" "$current" "$msg" > "$P"
            fi
          fi
          cat "$P"
      - name: Check external production destinations
        shell: bash
        run: |
          set -euo pipefail
          P=/tmp/phase22-final/reports/external-destinations.txt
          : > "$P"
          code=$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 30 https://evidenceaxis.com/contact/ || true)
          echo "https://evidenceaxis.com/contact/ HTTP=$code" >> "$P"
          case "$code" in 2*|3*) ;; *) echo "External destination failed" >&2; exit 1;; esac
      - name: Generate final Phase 22 production release packet
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,re
          P=pathlib.Path('/tmp/phase22-final')
          live=json.loads((P/'live/summary.json').read_text()); spot=json.loads((P/'live-spotcheck/phase21-spotcheck.json').read_text())['summary']
          pages=json.loads((P/'reports/pages-final-readback.json').read_text()); dep=json.loads((P/'reports/deployment-run.json').read_text())
          tls=json.loads((P/'live/tls-redirects.json').read_text()); film=json.loads((P/'live/film.json').read_text()); seo=json.loads((P/'live/seo-network.json').read_text())
          branch=(P/'reports/final-branch-readback.txt').read_text().strip(); residue=(P/'reports/temporary-branch-residue.txt').read_text().strip(); external=(P/'reports/external-destinations.txt').read_text().strip()
          cert=pages['https_certificate']; t=tls['tls'][0]
          packet=f'''# PHASE 22 — PRODUCTION RELEASE PACKET

**STATUS: READY FOR EXTERNAL RELEASE REVIEW**

## 1. Phase 21 approved RC SHA
`b247b536eda5b1f48ada5b6a09c657b324d289f1` — REVIEWER APPROVED PHASE 21 / PASS.

## 2. RC tree
`30a289aaf26cb1944baf76a5d9f53b98cc6e54dd`.

## 3. Pre-release rebuild readback
`rebuild/award-level-corporate-v2` = `b247b536eda5b1f48ada5b6a09c657b324d289f1`.

## 4. Pre-release main readback
`main` = `6d106520dd82bf4448312b5f45b54ae15981b1db`.

## 5. main → RC ancestry result
GitHub compare: `ahead_by=30`, `behind_by=0`; merge-base exactly the pre-release main SHA. Ancestry gate: **PASS**.

## 6. Exact promotion method
**FAST-FORWARD ONLY** using a non-forced branch-ref update from `6d106520...` to `b247b536...`. No force push, merge commit, squash, rebase, cherry-pick or replacement product commit.

## 7. Main post-promotion readback
`main` = `b247b536eda5b1f48ada5b6a09c657b324d289f1` — **PASS**.

## 8. Deployment run / deployment evidence
GitHub Pages workflow run `{dep['id']}` (`{dep['name']}`), run #{dep['run_number']}, branch `{dep['head_branch']}`, conclusion **{dep['conclusion'].upper()}**. Started `{dep['run_started_at']}`, updated `{dep['updated_at']}`. Pages upload artifact ID `9917560635`, digest `sha256:61b527df08948839610624f79237a3c93ae745f29ffe39feae04b8131abae6c6`.

## 9. Production SHA verification
Deployment head SHA and GitHub Pages `pages_build_version` are exactly `b247b536eda5b1f48ada5b6a09c657b324d289f1`. In addition, **23/23 stable live fingerprints** matched the frozen candidate byte-for-byte, including representative HTML, core CSS/JS/data, robots/sitemap, five social assets and protected film media.

## 10. Live production URL
`https://www.uniqueholding.com.tr/`.

## 11. DNS evidence
`www.uniqueholding.com.tr` resolves by CNAME to `morfisam25-tech.github.io`. Apex resolves to GitHub Pages A records `185.199.108.153`, `185.199.109.153`, `185.199.110.153`, `185.199.111.153`. Independent Google and Cloudflare resolvers were checked. No website-release change was made to MX/SPF/DKIM/DMARC/Google Workspace verification or unrelated TXT records.

## 12. TLS / certificate evidence
TLS verification: **PASS** for both `www.uniqueholding.com.tr` and `uniqueholding.com.tr`. Protocol `{t['protocol']}`. Issuer `{t['issuer'].get('O')} / {t['issuer'].get('CN')}`. SAN: `{t['subjectAltName']}`. Certificate state in GitHub Pages: `{cert['state']}`; expires `{cert['expires_at']}`. Browser/Node TLS validation reported no certificate warning or hostname error.

## 13. HTTP → HTTPS evidence
`http://www.uniqueholding.com.tr/` → `301` → canonical HTTPS www. `http://uniqueholding.com.tr/` → `301` → canonical HTTPS www. HTTPS apex → `301` → canonical HTTPS www. Canonical HTTPS www → `200`.

## 14. Mixed-content result
**PASS** — mixed-content HTTP subresource requests: `{live['mixedContentRequests']}`.

## 15. RELEASE-BLOCKER-HTTPS-001 closure evidence
GitHub Pages reports `https_enforced=true`, certificate `approved` for both apex and www; live trusted TLS, canonical redirects, mixed-content and same-origin asset checks all pass. **RELEASE-BLOCKER-HTTPS-001: CLOSED.**

## 16. 32-case production route smoke
**32 / 32 PASS**, failures `{spot['smokeFailures']}`. Sixteen routes were tested at `1440×900` and `390×844`, including the custom 404 surface.

## 17. 30 live production screenshots
**30 / 30 LIVE PRODUCTION VISUAL PASS.** All PNGs came from `https://www.uniqueholding.com.tr`, not local files. Every one was opened and manually inspected. Exact review list and screenshot SHA256s are included in `MANUAL_LIVE_VISUAL_REVIEW.md` and `reports/live-screenshot-sha256.txt`.

## 18. Production interaction results
**7 / 7 PASS**, failures `{spot['interactionFailures']}`. Coverage includes desktop/compact navigation, Escape/focus restoration, skip-link/keyboard focus, RFQ fill/reset/mailto/long-input behavior, external-link keyboard behavior and protected film controls. No real commercial RFQ email was sent. External production destination check: `{external}`.

## 19. Film production regression
**PASS.** Film/media present; poster present; muted fallback behavior available; WATCH WITH SOUND restarted at `00:00` and played with sound in the live test; captions toggled; CC control, replay and fullscreen passed; reduced-motion paused/muted at `00:00`; film MP4 and VTT returned HTTP 200; no same-origin film media failure. Protected live film/caption bytes match the approved candidate.

## 20. Prior real-device approval carry-forward
**PRIOR REAL-DEVICE APPROVAL: CARRIED FORWARD.** No new physical-device test is claimed in Phase 22.

## 21. PHASE19-FILM-PERFORMANCE-001 final disposition
**ACCEPTED PROTECTED LIMITATION — NOT A RELEASE BLOCKER.** The fixed `w=2000` poster remains protected and is **not** claimed optimized.

## 22. Production SEO result
**PASS** — `{live['routeSurface']}` HTML routes, `{live['indexable']}` indexable, `{live['noindex']}` noindex, `19` JSON-LD entities, no accidental staging/noindex header on indexable pages.

## 23. robots / sitemap result
`robots.txt` reachable; `sitemap.xml` reachable; sitemap contains exactly `{live['sitemap']}` URLs and all use the canonical www HTTPS host.

## 24. Canonical-host result
**PASS** — live indexable canonical URLs and `og:url` use `www.uniqueholding.com.tr`; no GitHub Pages hostname appears as production canonical.

## 25. Social-card accessibility result
**PASS** — five unique production social-card assets detected and accessible; Open Graph and Twitter metadata preserved.

## 26. Legal / privacy production result
**PASS** — `privacy.html` and `legal.html` reachable over HTTPS, live bytes match the approved candidate, canonical URLs are correct, and the observed external privacy destination resolves successfully. Existing formal legal-review boundaries are preserved; no statutory certification claim is made.

## 27. Live product counts
**Core Products: 3 · Inquiry Products: 62 · Invalid: 0.** Products data and representative production files match the candidate exactly; release-candidate static QA independently verified static core/inquiry card counts `3/62` with mismatch `0`.

## 28. Live network / console result
Critical same-origin network failures: `{live['criticalSameOriginNetworkFailures']}`. Mixed-content requests: `{live['mixedContentRequests']}`. Page-error contexts: `{live['pageErrorContexts']}`. Deep live errors: `{live['totalErrors']}`. **PASS**.

## 29. Rebuild final readback
`rebuild/award-level-corporate-v2` = `b247b536eda5b1f48ada5b6a09c657b324d289f1`.

## 30. Main final readback
`main` = `b247b536eda5b1f48ada5b6a09c657b324d289f1`.

Final branch readback evidence:
```
{branch}
```

## 31. Temporary branch residue status
```
{residue}
```
Only the known `__noop_should_not_create` branch was eligible for cleanup. Historical QA/review branches were not deleted.

## 32. Final release blockers
**TOTAL RELEASE BLOCKERS: 0.** Product release blockers: 0. Hosting/DNS/HTTPS release blockers: 0.

## 33. Artifact ID
Source live-evidence artifact used for deterministic final packaging: **`9921975696`** (`phase22-live-production-evidence-v2`). The final release-packet artifact receives its own GitHub-assigned ID only after upload and is recorded in the external release handoff.

## 34. Artifact digest
Source live-evidence artifact digest: **`sha256:88b53352e62ed2ffd885c70ccd80ec35b30d37bc15b17596292fe0d4fa49085f`**. The final release-packet upload digest is recorded by GitHub after upload in the external release handoff.

## 35. SHA256 manifest verification
A fresh `SHA256SUMS.txt` is generated over all final packet files **excluding the manifest itself** and verified with `sha256sum -c`: **PASS**.

## 36. Exact final production SHA
`b247b536eda5b1f48ada5b6a09c657b324d289f1`.

---

**RELEASE-BLOCKER-HTTPS-001: CLOSED**

**TOTAL RELEASE BLOCKERS: 0**

**WAITING FOR: REVIEWER APPROVED PHASE 22**
'''
          (P/'PHASE_22_PRODUCTION_RELEASE_PACKET.md').write_text(packet)
          final={'status':'READY FOR EXTERNAL RELEASE REVIEW','productionSha':'b247b536eda5b1f48ada5b6a09c657b324d289f1','productionTree':'30a289aaf26cb1944baf76a5d9f53b98cc6e54dd','main':'b247b536eda5b1f48ada5b6a09c657b324d289f1','rebuild':'b247b536eda5b1f48ada5b6a09c657b324d289f1','httpsBlocker':'CLOSED','https':'PASS','routeSmoke':'32/32 PASS','liveVisual':'30/30 PASS','interactions':'7/7 PASS','seo':'PASS','counts':'3/62/0','film':'PASS','criticalSameOriginNetworkFailures':0,'totalReleaseBlockers':0,'sourceEvidenceArtifactId':9921975696,'sourceEvidenceArtifactDigest':'sha256:88b53352e62ed2ffd885c70ccd80ec35b30d37bc15b17596292fe0d4fa49085f','waitingFor':'REVIEWER APPROVED PHASE 22'}
          (P/'phase22-final-manifest.json').write_text(json.dumps(final,indent=2,ensure_ascii=False))
          PY
      - name: Build and verify final SHA256 manifest
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/phase22-final
          rm -f SHA256SUMS.txt
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt | tee reports/sha256-verification.log
          test "$(grep -c ': FAILED' reports/sha256-verification.log || true)" = 0
      - name: Upload final Phase 22 release packet
        uses: actions/upload-artifact@v4
        with:
          name: phase22-production-release-packet-final
          path: /tmp/phase22-final/
          if-no-files-found: error
          compression-level: 6
