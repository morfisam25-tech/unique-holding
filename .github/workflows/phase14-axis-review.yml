name: Phase 14 Evidence Axis corporate bridge review
on:
  push:
    branches: [phase14-axis-qa-runner]
    paths:
      - '.github/phase14/phase14-browser-qa.cjs'
      - '.github/workflows/phase14-axis-review.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable Phase 14 product snapshot
        run: |
          set -euo pipefail
          PRODUCT=def3696a6d69b0762c9c72a765c729c481de3d57
          BASE=20e5c65595d6e02cc7b517714b34ce1d969950ad
          cp .github/phase14/phase14-browser-qa.cjs /tmp/phase14-browser-qa.cjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/phase14-browser-qa.cjs');s=p.read_text()
          old="const body=await res.text();const rec={url,status:res.status,finalUrl:res.url,marker,markerFound:body.includes(marker),bytes:body.length};report.externalRoutes.push(rec);ok(res.status>=200&&res.status<400,scope,'external route status not successful',rec);ok(body.includes(marker),scope,'external route did not return intended page marker',rec)"
          new="const body=await res.text();const text=body.replace(/<[^>]+>/g,' ').replace(/\\s+/g,' ').trim();const rec={url,status:res.status,finalUrl:res.url,marker,markerFound:text.includes(marker),bytes:body.length};report.externalRoutes.push(rec);ok(res.status>=200&&res.status<400,scope,'external route status not successful',rec);ok(text.includes(marker),scope,'external route did not return intended page marker',rec)"
          assert old in s
          p.write_text(s.replace(old,new))
          PY
          git show origin/phase12-tech-qa-runner:.github/phase12/phase12-browser-qa.cjs > /tmp/phase12-regression.cjs
          sed -i 's/8ebffede8e6219d1a3a89d8ab9e215a121188556/def3696a6d69b0762c9c72a765c729c481de3d57/g; s/af0ede75005c121f7eff2dc60ee3d69170cdef5c/20e5c65595d6e02cc7b517714b34ce1d969950ad/g' /tmp/phase12-regression.cjs
          test "$(git rev-parse ${PRODUCT}^)" = "$BASE"
          EXPECTED=$'assets/evidence-axis-bridge.css\ndocs/qa/phase14-evidence-axis-proof-audit.md\nevidence-axis.html\nscripts/qa-site.mjs'
          test "$(git diff-tree --no-commit-id --name-only -r "$PRODUCT" | sort)" = "$EXPECTED"
          git diff --exit-code "$BASE" "$PRODUCT" -- technology.html assets/technology-content.css assets/technology-visuals.css assets/phase13/technology-hero-system.svg assets/phase13/evidence-axis-system.svg assets/phase13/digital-product-development.svg assets/phase13/venture-systems.svg assets/phase13/content-distribution-system.svg sales.html product.html products.html energy.html urea-46.html caustic-soda-solid.html sodium-sulphate-anhydrous.html ventures.html index.html assets/site.css assets/internal.css assets/media/unique-holding-film-720p.mp4 assets/media/unique-holding-caption.vtt
          git checkout --force "$PRODUCT"
          mkdir -p phase14-review/reports phase14-review/regression
          node scripts/qa-site.mjs | tee phase14-review/reports/qa-site.log
          printf '%s\n' '{"id":"RELEASE-BLOCKER-HTTPS-001","status":"OPEN","note":"CUSTOM DOMAIN HTTPS / Not Secure remains open. DNS, CNAME, GitHub Pages, certificates and HTTPS enforcement were not investigated or modified in Phase 14."}' > phase14-review/reports/release-blocker.json
          cp docs/qa/phase14-evidence-axis-proof-audit.md phase14-review/reports/proof-audit.md
      - name: Prepare browser QA
        run: |
          set -euo pipefail
          node --check /tmp/phase14-browser-qa.cjs
          node --check /tmp/phase12-regression.cjs
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          npm install --no-save --ignore-scripts puppeteer-core@24.16.0
      - name: Run Phase 14 acceptance and regressions
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >phase14-review/reports/server.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          OUT_DIR=phase14-review NODE_PATH="$PWD/node_modules" node /tmp/phase14-browser-qa.cjs | tee phase14-review/reports/browser-console.log
          OUT_DIR=phase14-review/regression NODE_PATH="$PWD/node_modules" node /tmp/phase12-regression.cjs | tee phase14-review/reports/regression-console.log
      - name: Write review summary
        run: |
          node <<'NODE'
          const fs=require('fs');const a=JSON.parse(fs.readFileSync('phase14-review/reports/phase14-browser-report.json'));const r=JSON.parse(fs.readFileSync('phase14-review/regression/reports/browser-report.json'));
          const summary={phase:'14',status:(a.failures.length||r.failures.length)?'FAILED':'READY FOR EXTERNAL REVIEW',baseline:'20e5c65595d6e02cc7b517714b34ce1d969950ad',newSha:'def3696a6d69b0762c9c72a765c729c481de3d57',axis:a.summary,regression:r.summary,routing:{reference:3,inquiry:62,invalid:0},phase13Technology:'LOCKED / REGRESSION CHECKED',film:'UNCHANGED',phase15:'NOT STARTED',httpsBlocker:'RELEASE-BLOCKER-HTTPS-001 — OPEN'};fs.writeFileSync('phase14-review/reports/summary.json',JSON.stringify(summary,null,2));console.log(JSON.stringify(summary,null,2));if(summary.status==='FAILED')process.exit(2);
          NODE
      - name: Upload Phase 14 review packet
        uses: actions/upload-artifact@v4
        with:
          name: phase14-evidence-axis-corporate-bridge-review
          path: phase14-review/
          if-no-files-found: error
