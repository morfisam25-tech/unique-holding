name: Phase 18 SEO build and review v2

on:
  push:
    branches: ["phase18-seo-qa-runner-v2"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase18:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout QA runner v2
        uses: actions/checkout@v4
        with:
          ref: phase18-seo-qa-runner-v2
          path: qa-harness
          fetch-depth: 1

      - name: Checkout exact Phase 18 baseline
        uses: actions/checkout@v4
        with:
          ref: 6f9d49cb96b4599f4518a07a5927090c6daea563
          path: product
          fetch-depth: 0

      - name: Run gated Phase 18 build, QA and single commit
        working-directory: product
        shell: bash
        run: bash ../qa-harness/.github/phase18/run_phase18_v2.sh

      - name: Upload Phase 18 review packet
        uses: actions/upload-artifact@v4
        with:
          name: phase18-review-packet
          path: /tmp/phase18-review-packet/
          if-no-files-found: error
          compression-level: 6
