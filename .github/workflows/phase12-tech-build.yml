name: Phase 12 technology candidate build
on:
  push:
    branches: [phase12-tech-build-runner]
    paths:
      - '.github/workflows/phase12-tech-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build one-commit Phase 12 candidate
        run: |
          set -euo pipefail
          BASE=af0ede75005c121f7eff2dc60ee3d69170cdef5c
          git config user.name "morfisam25-tech"
          git config user.email "morfisam25@gmail.com"
          git checkout -B phase12-tech-candidate "$BASE"

          cat > technology.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0b"><title>Technology & Intelligence | Unique Holding</title><meta name="description" content="Technology and intelligence at Unique Holding: Evidence Axis, development-stage digital products, venture systems and content/distribution capabilities alongside active industrial operations."><link rel="canonical" href="https://www.uniqueholding.com.tr/technology.html"><script>document.documentElement.classList.add('js')</script><link rel="stylesheet" href="assets/site.css"><link rel="stylesheet" href="assets/internal.css"><link rel="stylesheet" href="assets/technology-visuals.css"><link rel="stylesheet" href="assets/technology-content.css"></head>
          <body class="subsite-body"><a class="skip-link" href="#main">Skip to content</a>
          <header class="site-header" data-header><div class="nav-shell"><a class="brand" href="index.html" aria-label="Unique Holding home"><span class="brand-symbol" aria-hidden="true"><i></i><i></i></span><span class="sub-brand"><b>UNIQUE HOLDING</b><small>Technology &amp; Intelligence</small></span></a><button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Open navigation"><span></span><span></span></button><nav id="primary-nav" class="primary-nav" aria-label="Primary navigation"><a href="corporate.html" data-nav-key="corporate">Corporate</a><a href="energy.html" data-nav-key="energy">Energy &amp; Trade</a><a href="technology.html" data-nav-key="technology" aria-current="page">Technology</a><a href="ventures.html" data-nav-key="portfolio">Portfolio</a><a href="contact.html" data-nav-key="contact">Contact</a><a class="sales-link nav-cta" href="sales.html" data-nav-key="sales">Industrial Sales</a></nav></div></header>
          <main id="main">
          <section class="subsite-hero tech tech-phase12-hero"><div class="inner"><p class="subsite-label">Unique Holding / Technology &amp; Intelligence</p><h1>Technology &amp; intelligence for decisions, products and new ventures.</h1><p class="intro">Unique Holding remains active in energy, petrochemicals, industrial chemicals and global trade. Technology &amp; Intelligence is a major growth direction across specialist research, digital product development, venture systems and content/distribution capabilities.</p><div class="tech-hero-actions"><a class="text-link" href="#operating-areas">Operating areas <span aria-hidden="true">↓</span></a><a class="text-link" href="evidence-axis.html">Evidence Axis <span aria-hidden="true">↗</span></a></div></div></section>

          <section class="subsite-section" id="operating-areas"><div class="section-cap"><span class="num">01 / Technology &amp; Intelligence</span><h2>Four operating areas. Different stages and roles.</h2><p>The technology platform combines one specialist venture, development-stage digital products and two supporting capability systems. The status labels below are deliberate: these areas are not presented as equally mature.</p></div><div class="tech-status-key" aria-label="Technology status key"><span><b>Active operating area</b> current operating work</span><span><b>Development-stage</b> product work still being built and tested</span><span><b>Capability / system</b> operating capability used where relevant</span></div><div class="route-grid tech-operating-grid">
          <a class="route-card tech-overview-card tech-card--evidence-axis" data-tech-area="evidence-axis" href="evidence-axis.html"><span class="k">01 / Evidence Axis</span><span class="tech-status">Specialist venture · Active operating area</span><h3>Evidence Axis</h3><p>Competitive intelligence and evidence-led decision support for B2B SaaS, operating through its own specialist brand.</p><b aria-hidden="true">↗</b></a>
          <a class="route-card tech-overview-card tech-card--digital-products" data-tech-area="digital-products" href="#digital-products"><span class="k">02 / Digital Products</span><span class="tech-status">Development-stage area</span><h3>Digital Products</h3><p>Selected internet and software products move through research, build and practical testing before any broader operating status is assigned.</p><b aria-hidden="true">↓</b></a>
          <a class="route-card tech-overview-card tech-card--advisory" data-tech-area="venture-advisory" href="#venture-systems"><span class="k">03 / Business &amp; Venture Advisory</span><span class="tech-status">Capability / system</span><h3>Business &amp; Venture Advisory</h3><p>Problem framing, commercial logic, operating design and launch planning for selected business and venture questions.</p><b aria-hidden="true">↓</b></a>
          <a class="route-card tech-overview-card tech-card--content" data-tech-area="content-distribution" href="#content-distribution"><span class="k">04 / Content &amp; Distribution Systems</span><span class="tech-status">Capability / system</span><h3>Content &amp; Distribution Systems</h3><p>Positioning, repeatable content formats and distribution workflows used where they support an operating activity or venture.</p><b aria-hidden="true">↓</b></a>
          </div></section>

          <section class="subsite-section paper" id="evidence-driven-intelligence"><div class="section-cap"><span class="num">02 / Evidence-Driven Intelligence</span><h2>Evidence Axis.</h2><p>Evidence Axis is a specialist venture within the Unique Holding portfolio, focused on competitive intelligence, B2B SaaS competitive research and decision-oriented research.</p></div><div class="tech-definition-grid"><article><span class="tech-status tech-status--paper">Specialist venture</span><h3>Evidence before interpretation.</h3><p>The work separates source-backed facts from interpretation and unknowns, then organizes research around decisions rather than volume of information.</p></article><article><span class="tech-status tech-status--paper">Relationship boundary</span><h3>Specialist brand, portfolio relationship.</h3><p>The Holding site describes the portfolio relationship only. Evidence Axis keeps its specialist market identity, method and deeper public explanation on its own route and website.</p><div class="tech-inline-actions"><a class="text-link" href="evidence-axis.html">Evidence Axis overview <span aria-hidden="true">↗</span></a><a class="text-link" href="https://evidenceaxis.com" target="_blank" rel="noopener">evidenceaxis.com <span aria-hidden="true">↗</span></a></div></article></div></section>

          <section class="subsite-section alt" id="digital-products"><div class="section-cap"><span class="num">03 / Digital Product Development</span><h2>Build selectively. Assign status carefully.</h2><p>Digital Products is an active development area, not a statement that every product is already operating in market.</p></div><div class="tech-definition-grid"><article><span class="tech-status">Development-stage area</span><h3>Research → Build → Test.</h3><p>Selected product work starts with a defined problem, moves into product and operating development, and is tested before a broader operating status is assigned.</p></article><article><span class="tech-status">Development-stage product</span><h3>YEKI HAST.</h3><p>YEKI HAST is a development-stage digital product within the Technology &amp; Intelligence track. Phase 12 records that status only; the deeper product and venture treatment remains on the Portfolio route.</p><a class="text-link" href="ventures.html">Portfolio / Venture Development <span aria-hidden="true">↗</span></a></article></div></section>

          <section class="subsite-section" id="venture-systems"><div class="section-cap"><span class="num">04 / Business / Venture Systems</span><h2>Business &amp; Venture Advisory.</h2><p>A narrow capability for turning selected business or venture questions into clearer operating choices.</p></div><div class="tech-system-grid"><article><h3>Problem framing</h3><p>Define the operating question, constraints and decision that need to be resolved.</p></article><article><h3>Commercial logic</h3><p>Structure the business model, route to market and practical assumptions that require testing.</p></article><article><h3>Operating design</h3><p>Map the workflows, responsibilities and systems needed to move an initiative from concept toward operation.</p></article></div><p class="tech-boundary-note">This capability is business and venture operating work; it is not financial, legal or investment advice.</p></section>

          <section class="subsite-section paper" id="content-distribution"><div class="section-cap"><span class="num">05 / Content &amp; Distribution Systems</span><h2>Systems that make an operating idea understandable and repeatable.</h2><p>Content and distribution are treated as operating capabilities when a venture or business area needs clear positioning, repeatable formats and disciplined publishing workflows.</p></div><div class="tech-system-grid tech-system-grid--paper"><article><h3>Positioning</h3><p>Translate a product, capability or research output into concrete language for the intended audience.</p></article><article><h3>Repeatable formats</h3><p>Create reusable content structures that reduce one-off production and preserve message discipline.</p></article><article><h3>Distribution workflow</h3><p>Organize channel, cadence and handoff decisions around the needs of the underlying operating activity.</p></article></div></section>

          <section class="subsite-section alt" id="group-fit"><div class="section-cap"><span class="num">06 / How Technology Fits the Group</span><h2>Industrial activity continues. Technology expands the operating range.</h2><p>Unique Holding's industrial business provides operating context and commercial discipline across energy, petrochemicals, industrial chemicals and global trade. Technology &amp; Intelligence extends the group's work into research, decision systems, digital products, business systems and new ventures without replacing the industrial activity.</p></div><div class="tech-sequence" aria-label="Explanatory technology operating sequence"><div><span>01</span><h3>Observe</h3><p>Start with the operating problem and available evidence.</p></div><div><span>02</span><h3>Analyze</h3><p>Separate facts, assumptions, constraints and decisions.</p></div><div><span>03</span><h3>Build</h3><p>Create the product, system or operating response.</p></div><div><span>04</span><h3>Test</h3><p>Check the response against practical requirements.</p></div><div><span>05</span><h3>Operate</h3><p>Assign a clearer operating status only when the work supports it.</p></div></div><p class="tech-boundary-note">This is an explanatory working sequence, not a named methodology.</p></section>

          <section class="subsite-section" id="next-step"><div class="section-cap"><span class="num">07 / Portfolio / Next Step</span><h2>Go to the relevant operating context.</h2><p>Use the specialist venture, portfolio or corporate contact route according to the question.</p></div><div class="route-grid tech-next-grid"><a class="route-card" href="evidence-axis.html"><span class="k">Specialist venture</span><h3>Evidence Axis</h3><p>Competitive intelligence and evidence-led decision support.</p><b aria-hidden="true">↗</b></a><a class="route-card" href="ventures.html"><span class="k">Development-stage products</span><h3>Portfolio</h3><p>Selected digital product and venture-development context.</p><b aria-hidden="true">↗</b></a><a class="route-card" href="contact.html"><span class="k">Corporate route</span><h3>Contact</h3><p>Use the corporate contact route for technology, venture or group-level inquiries.</p><b aria-hidden="true">↗</b></a></div></section>
