name: Import homepage film

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-homepage-film.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-film:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Add homepage film import workflow'
    runs-on: ubuntu-latest
    env:
      VIDEO_URL: "https://files2.heygen.ai/aws_pacific/avatar_tmp/3a961eba60894085851c5cbb0acf59a7/vc5dde97b670f41d8a4240d5a9535f705/a2223e7182ca4443b0cf8b5aee275459.mp4?Expires=1788635411&Signature=aHKSCQh3oEQGOxuzMEtBrkvM78~QqZl15PvR2U5erfqGDcebi7PDFHwVLBPEKzFTvDoXLIElXXdt4E8i5KLKHMc0wi3SCsLQtnH1XSvLCV-zCIuO6POW1eQqtZhDqL1XeJmsEg5VHvYYw5CqeRrsUzuopwNyoeayoIkbxDdpikU-zNByNTmEvAtqpCvc8Ut20phvPyda1rnJNUPcGnnyZrOG7iMnL-1R7oR2tjKh-hCJAuEyb9bX1EhLCX2EzeMDS4KSMyt0Wkpj3x2OMBAN0qeChG-NwFPou0IZexrf-cA0Hoa9ac5QimnEUtzh09DMiGquwdg~-wq1LqXoKBdldQ__&Key-Pair-Id=K38HBHX5LX3X2H"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Download approved corporate film
        run: |
          curl -L --fail --retry 3 --retry-delay 2 "$VIDEO_URL" -o /tmp/unique-holding-source.mp4
          test -s /tmp/unique-holding-source.mp4

      - name: Encode web-optimized 720p MP4
        run: |
          mkdir -p assets/media
          ffmpeg -y -i /tmp/unique-holding-source.mp4 \
            -vf "scale=-2:720" \
            -c:v libx264 -preset medium -profile:v high -level 4.0 \
            -b:v 1000k -maxrate 1200k -bufsize 2400k \
            -c:a aac -b:a 96k -ac 2 \
            -movflags +faststart \
            assets/media/unique-holding-film-720p.mp4
          test $(stat -c%s assets/media/unique-holding-film-720p.mp4) -lt 100000000

      - name: Commit film asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media/unique-holding-film-720p.mp4
          git diff --cached --quiet && exit 0
          git commit -m "Add optimized homepage corporate film"
          git push origin main
