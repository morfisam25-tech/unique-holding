name: Phase 13 technology visual candidate build
on:
  push:
    branches: [phase13-tech-build-runner]
    paths:
      - '.github/workflows/phase13-tech-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build one-commit Phase 13 candidate
        run: |
          set -euo pipefail
          BASE=1ecb43028b3b50b3a44e0b86f0cdef7b671f164f
          git config user.name "morfisam25-tech"
          git config user.email "morfisam25@gmail.com"
          git checkout -B phase13-tech-candidate "$BASE"
          mkdir -p assets/phase13 docs/qa

          python3 - <<'PY'
          from pathlib import Path
          p=Path('technology.html'); s=p.read_text()
          hero='<section class="subsite-hero tech tech-phase12-hero"><div class="inner">'
          hero_new='<section class="subsite-hero tech tech-phase12-hero"><div class="tech-phase13-hero-visual"><img data-tech-visual="hero" src="assets/phase13/technology-hero-system.svg" width="2400" height="1350" alt="Abstract editorial system of connected evidence, product and decision nodes." decoding="async" fetchpriority="high"></div><div class="inner">'
          assert hero in s
          s=s.replace(hero,hero_new,1)
          inserts={
            '<a class="route-card tech-overview-card tech-card--evidence-axis" data-tech-area="evidence-axis" href="evidence-axis.html">':'<a class="route-card tech-overview-card tech-card--evidence-axis" data-tech-area="evidence-axis" href="evidence-axis.html"><span class="tech-card-media"><img data-tech-visual="evidence-axis" src="assets/phase13/evidence-axis-system.svg" width="1600" height="900" alt="Abstract evidence map connecting source records, verification points and a decision axis." loading="lazy" decoding="async"></span>',
            '<a class="route-card tech-overview-card tech-card--digital-products" data-tech-area="digital-products" href="#digital-products">':'<a class="route-card tech-overview-card tech-card--digital-products" data-tech-area="digital-products" href="#digital-products"><span class="tech-card-media"><img data-tech-visual="digital-products" src="assets/phase13/digital-product-development.svg" width="1600" height="900" alt="Abstract development flow from research through build and testing." loading="lazy" decoding="async"></span>',
            '<a class="route-card tech-overview-card tech-card--advisory" data-tech-area="venture-advisory" href="#venture-systems">':'<a class="route-card tech-overview-card tech-card--advisory" data-tech-area="venture-advisory" href="#venture-systems"><span class="tech-card-media"><img data-tech-visual="venture-advisory" src="assets/phase13/venture-systems.svg" width="1600" height="900" alt="Abstract decision framework linking problem framing, commercial logic and operating design." loading="lazy" decoding="async"></span>',
            '<a class="route-card tech-overview-card tech-card--content" data-tech-area="content-distribution" href="#content-distribution">':'<a class="route-card tech-overview-card tech-card--content" data-tech-area="content-distribution" href="#content-distribution"><span class="tech-card-media"><img data-tech-visual="content-distribution" src="assets/phase13/content-distribution-system.svg" width="1600" height="900" alt="Abstract editorial workflow linking content blocks to distribution paths." loading="lazy" decoding="async"></span>'
          }
          for old,new in inserts.items():
              assert old in s
              s=s.replace(old,new,1)
          p.write_text(s)
          PY

          cat > assets/technology-visuals.css <<'CSS'
          @layer page{
          /* Phase 13 — provenance-safe Technology visuals. No remote imagery. */
          .subsite-hero.tech:before{background-image:none!important;background:#080a0b!important}
          .tech-phase13-hero-visual{position:absolute;inset:0;z-index:0;overflow:hidden;background:#080a0b}
          .tech-phase13-hero-visual:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 73% 42%,rgba(255,122,50,.08),transparent 28%),linear-gradient(90deg,rgba(3,5,6,.22),rgba(3,5,6,.08) 60%,rgba(3,5,6,.2));pointer-events:none}
          .tech-phase13-hero-visual img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 50%;filter:saturate(.92) contrast(1.04)}
          .subsite-hero.tech:after{z-index:1;background:linear-gradient(90deg,rgba(3,5,6,.88),rgba(3,5,6,.45) 57%,rgba(3,5,6,.22)),linear-gradient(0deg,rgba(3,5,6,.9),transparent 58%)}
          .subsite-hero.tech .inner{z-index:2}

          .tech-overview-card{position:relative;isolation:isolate;overflow:hidden;min-height:340px;background:#0b0e0f!important;background-image:none!important}
          .tech-overview-card>.tech-card-media{position:absolute;inset:0;z-index:0;display:block;overflow:hidden;background:#0a0d0e}
          .tech-card-media img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 50%;opacity:.9;filter:saturate(.92) contrast(1.06)}
          .tech-overview-card::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(3,5,6,.18) 0%,rgba(3,5,6,.5) 42%,rgba(3,5,6,.96) 100%),linear-gradient(90deg,rgba(3,5,6,.38),transparent 72%);pointer-events:none}
          .tech-overview-card>*:not(.tech-card-media){position:relative;z-index:2}
          .tech-overview-card .k{color:#ff7a32;text-shadow:0 1px 12px rgba(0,0,0,.55)}
          .tech-overview-card h3{color:#f4f0e8;text-shadow:0 2px 18px rgba(0,0,0,.72);margin-top:auto;padding-top:84px}
          .tech-overview-card p{color:#d0d4d5;text-shadow:0 1px 12px rgba(0,0,0,.7)}
          .tech-overview-card b{color:#ff7a32}
          .route-card.tech-overview-card:hover{filter:brightness(1.04)}
          .tech-card--evidence-axis .tech-card-media img{object-position:50% 48%;opacity:.96}
          .tech-card--digital-products .tech-card-media img{object-position:50% 50%;opacity:.88}
          .tech-card--advisory .tech-card-media img{object-position:50% 50%;opacity:.86}
          .tech-card--content .tech-card-media img{object-position:50% 52%;opacity:.88}
          .tech-card--evidence-axis::after{content:"EVIDENCE AXIS  /  SPECIALIST INTELLIGENCE";position:absolute;z-index:2;right:22px;top:24px;max-width:180px;color:rgba(244,240,232,.72);font-size:7px;line-height:1.45;letter-spacing:.22em;text-align:right;text-transform:uppercase;padding-right:12px;border-right:1px solid rgba(255,122,50,.75);pointer-events:none}

          @media(max-width:1100px){.tech-overview-card{min-height:320px}.tech-overview-card h3{padding-top:70px}}
          @media(max-width:760px){
            .tech-phase13-hero-visual img{object-position:50% 50%}
            .tech-overview-card{min-height:300px}
            .tech-overview-card h3{padding-top:64px}
            .tech-card-media img{object-position:50% 50%}
            .tech-card--evidence-axis::after{right:18px;top:20px;max-width:150px;font-size:6px}
          }
          }
