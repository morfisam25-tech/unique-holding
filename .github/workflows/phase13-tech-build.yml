          cat > docs/qa/phase13-technology-visual-provenance.md <<'MD'
          # Phase 13 — Technology Visual Provenance Record

          Internal QA record. Not public site copy.

          ## Before audit

          | Asset / source | Page location | Subject seen in Phase 12 render | Provenance class | Public implication risk | Decision |
          | --- | --- | --- | --- | --- | --- |
          | `images.unsplash.com/photo-1779896411954-9129882c996d` | Technology hero | People gathered around a laptop in an office/work session | UNVERIFIED | Could imply actual Unique Holding staff, clients or operating team | REMOVE from rendered Technology route |
          | `images.unsplash.com/photo-1782330299430-9aa9e8f3bc39` | Evidence Axis card | Glowing hardware / machine-like technology composition | UNVERIFIED | Could imply proprietary AI, hardware or technical infrastructure | REMOVE |
          | `images.unsplash.com/photo-1771923082503-0a3381c46cef` | Digital Products card | Laptop displaying a software task/interface screen | UNVERIFIED | Could be mistaken for an actual live Unique/YEKI HAST product interface | REMOVE |
          | `images.unsplash.com/photo-1758876202980-0a28b744fb24` | Business & Venture Advisory card | Two people in a meeting with planning material behind them | UNVERIFIED | Could imply real advisors, clients, staff scale or a photographed engagement | REMOVE |
          | `images.unsplash.com/photo-1627244714766-94dab62ed964` | Content & Distribution card | Person at a video-editing workstation | UNVERIFIED | Could imply an owned studio, actual production team or demonstrated workflow | REMOVE |

          Exact photographer/license metadata for those remote image URLs was not recorded in the repository, so none is retained as evidence.

          ## Approved Phase 13 system

          | Asset path | Source | Class | Section | Reasonable public implication | Approved use | Restrictions |
          | --- | --- | --- | --- | --- | --- | --- |
          | `assets/phase13/technology-hero-system.svg` | Created in-repo from geometric SVG primitives during Phase 13 | ILLUSTRATIVE | Hero | Technology/intelligence involves connected evidence, products and decisions | Editorial hero only | Not evidence of software, infrastructure, staff or customers |
          | `assets/phase13/evidence-axis-system.svg` | Created in-repo from geometric SVG primitives during Phase 13 | ILLUSTRATIVE | Evidence Axis operating-area card | Evidence is organized through records, verification and decisions | Editorial explanation only | Not an Evidence Axis screenshot or client deliverable |
          | `assets/phase13/digital-product-development.svg` | Created in-repo from geometric SVG primitives during Phase 13 | ILLUSTRATIVE | Digital Products card | Product work moves through staged development | Development-stage editorial visual | Not a product UI; must not be presented as launched software |
          | `assets/phase13/venture-systems.svg` | Created in-repo from geometric SVG primitives during Phase 13 | ILLUSTRATIVE | Business & Venture Advisory card | Business questions are framed through structured decision logic | Editorial capability visual | No investment, financial-advice or client-engagement implication |
          | `assets/phase13/content-distribution-system.svg` | Created in-repo from geometric SVG primitives during Phase 13 | ILLUSTRATIVE | Content & Distribution card | Content moves through structured editorial/distribution paths | Editorial capability visual | No KPI, audience-scale, publisher, ownership or performance implication |

          ## Design restrictions

          - No third-party logos or brand marks.
          - No fake dashboards, analytics, customer portals, code editors, API consoles or KPI charts.
          - No people, offices, servers or hardware presented as owned operating evidence.
          - No visual is captioned as proof.
          - SVGs contain no remote resources or scripts.
          - Phase 12 content remains the authority for operating status.
          MD

          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/qa-site.mjs'); s=p.read_text()
          marker="\nif(errors.length){console.error('\\nTECHNICAL QA FAILED');"
          assert marker in s
          block=r'''

          // Phase 13 — provenance-safe Technology visual-system guards.
          {
            const technology=read('technology.html');const technologyMain=technology.match(/<main\b[\s\S]*?<\/main>/i)?.[0]||'';const visualCss=read('assets/technology-visuals.css');
            const visualAssets=[
              ['hero','assets/phase13/technology-hero-system.svg',2400,1350],
              ['evidence-axis','assets/phase13/evidence-axis-system.svg',1600,900],
              ['digital-products','assets/phase13/digital-product-development.svg',1600,900],
              ['venture-advisory','assets/phase13/venture-systems.svg',1600,900],
              ['content-distribution','assets/phase13/content-distribution-system.svg',1600,900]
            ];
            if(/images\.unsplash\.com|https?:\/\//i.test(visualCss))errors.push('Phase 13: Technology visual stylesheet must contain no remote media URLs');
            if(!visualCss.includes('.subsite-hero.tech:before{background-image:none!important'))errors.push('Phase 13: inherited unverified Technology hero must be explicitly disabled');
            const tags=[...technologyMain.matchAll(/<img\b[^>]*data-tech-visual=["']([^"']+)["'][^>]*>/gi)].map(m=>m[0]);
            if(tags.length!==5)errors.push('Phase 13: expected exactly five Technology visual image records, found '+tags.length);
            const altBan=/best|leading|trusted|customer|client|live platform|production-ready|market leader|award-winning/i;
            for(const [key,asset,w,h] of visualAssets){
              if(!files.includes(asset)){errors.push('Phase 13 asset missing -> '+asset);continue}
              const svg=read(asset);
              if(!new RegExp('<svg[^>]*width=["\']'+w+'["\'][^>]*height=["\']'+h+'["\'][^>]*viewBox=["\']0 0 '+w+' '+h+'["\']','i').test(svg))errors.push('Phase 13 SVG intrinsic dimensions/viewBox invalid -> '+asset);
              if(/https?:\/\/|<script\b|<image\b[^>]*(?:href|xlink:href)=/i.test(svg))errors.push('Phase 13 SVG must not load remote/scripted content -> '+asset);
              if(fs.statSync(path.join(root,asset)).size>80000)errors.push('Phase 13 SVG unexpectedly large -> '+asset);
              const tag=tags.find(t=>attr(t,'data-tech-visual')===key)||'';
              if(!tag){errors.push('technology.html: Phase 13 visual tag missing -> '+key);continue}
              if(attr(tag,'src')!==asset)errors.push('technology.html: Phase 13 visual src mismatch -> '+key);
              if(Number(attr(tag,'width'))!==w||Number(attr(tag,'height'))!==h)errors.push('technology.html: Phase 13 width/height attributes mismatch -> '+key);
              const alt=attr(tag,'alt');if(!alt||altBan.test(alt))errors.push('technology.html: Phase 13 alt text missing or claim-bearing -> '+key);
              if(key!=='hero'&&attr(tag,'loading')!=='lazy')errors.push('technology.html: below-fold Phase 13 visual must lazy-load -> '+key);
              if(attr(tag,'decoding')!=='async')errors.push('technology.html: Phase 13 visual must decode async -> '+key);
            }
            for(const token of ['01 / Technology &amp; Intelligence','02 / Evidence-Driven Intelligence','03 / Digital Product Development','04 / Business / Venture Systems','05 / Content &amp; Distribution Systems','06 / How Technology Fits the Group','07 / Portfolio / Next Step','a specialist venture within the Unique Holding portfolio','YEKI HAST is a development-stage digital product','Industrial activity continues. Technology expands the operating range.'])if(!technologyMain.includes(token))errors.push('Phase 13: Phase 12 content lock regression -> '+token);
            if(!fs.existsSync(path.join(root,'docs/qa/phase13-technology-visual-provenance.md')))errors.push('Phase 13 provenance record missing');
            const provenance=read('docs/qa/phase13-technology-visual-provenance.md');
            for(const token of ['UNVERIFIED','REMOVE','ILLUSTRATIVE','technology-hero-system.svg','evidence-axis-system.svg','digital-product-development.svg','venture-systems.svg','content-distribution-system.svg'])if(!provenance.includes(token))errors.push('Phase 13 provenance record incomplete -> '+token);
            const sales=read('sales.html');for(const token of ['01 / Product','02 / Grade / Specification','03 / Quantity','04 / Destination','05 / Timing','06 / Specification / Technical Requirement','07 / Contact','sales@uniqueholding.com.tr','mailto:sales@uniqueholding.com.tr?subject='])if(!sales.includes(token))errors.push('Phase 13: Phase 11 RFQ lock regression -> '+token);
            const p09=read('products.html');const refs=(p09.match(/data-destination="reference-detail"/g)||[]).length;const inquiries=(p09.match(/data-destination="inquiry-detail"/g)||[]).length;if(refs!==3||inquiries!==62)errors.push('Phase 13: Phase 09 3/62 classification regression');
            const releaseBlocker={id:'RELEASE-BLOCKER-HTTPS-001',status:'OPEN'};if(releaseBlocker.status!=='OPEN')errors.push('Phase 13: RELEASE-BLOCKER-HTTPS-001 must remain OPEN');
          }
          '''
          s=s.replace(marker,block+marker)
          s=s.replace('Phase 09/10/11/12 guards passed; protected film hashes verified.','Phase 09/10/11/12/13 guards passed; protected film hashes verified.')
          p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re,html,subprocess
          base='1ecb43028b3b50b3a44e0b86f0cdef7b671f164f'
          old=subprocess.check_output(['git','show',f'{base}:technology.html'],text=True)
          new=Path('technology.html').read_text()
          def visible(x):
              m=re.search(r'<main\b[\s\S]*?</main>',x,re.I); x=m.group(0)
              x=re.sub(r'<[^>]+>',' ',x); x=html.unescape(x); return re.sub(r'\s+',' ',x).strip()
          assert visible(old)==visible(new), 'Phase 12 visible Technology content changed in Phase 13'
          print('PHASE 12 VISIBLE CONTENT LOCK: PASS')
          PY

