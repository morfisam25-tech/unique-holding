name: Phase 19 baseline audit
on:
  push:
    branches: ["phase19-audit-runner"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout QA harness
        uses: actions/checkout@v4
        with:
          ref: phase19-audit-runner
          path: qa-harness
          fetch-depth: 1
      - name: Checkout exact Phase 19 baseline
        uses: actions/checkout@v4
        with:
          ref: 8d2811298c668865f5438f86337c9d8f9d959c80
          path: product
          fetch-depth: 0
      - name: Run Phase 19 baseline audit
        working-directory: product
        shell: bash
        run: bash ../qa-harness/.github/phase19/run_baseline.sh
      - name: Upload baseline packet
        uses: actions/upload-artifact@v4
        with:
          name: phase19-baseline-packet
          path: /tmp/phase19-baseline/
          if-no-files-found: error
          compression-level: 6
