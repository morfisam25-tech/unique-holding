name: Phase 12 technology review
on:
  push:
    branches: [phase12-tech-qa-runner]
    paths:
      - '.github/phase12/phase12-browser-qa.cjs'
      - '.github/workflows/phase12-tech-review.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable Phase 12 product snapshot
        run: |
          set -euo pipefail
          PRODUCT=1ecb43028b3b50b3a44e0b86f0cdef7b671f164f
          BASE=af0ede75005c121f7eff2dc60ee3d69170cdef5c
          cp .github/phase12/phase12-browser-qa.cjs /tmp/phase12-browser-qa.cjs
          sed -i 's/8ebffede8e6219d1a3a89d8ab9e215a121188556/1ecb43028b3b50b3a44e0b86f0cdef7b671f164f/g' /tmp/phase12-browser-qa.cjs
          test "$(git rev-parse ${PRODUCT}^)" = "$BASE"
          EXPECTED=$'assets/technology-content.css\nscripts/qa-site.mjs\ntechnology.html'
          test "$(git diff-tree --no-commit-id --name-only -r "$PRODUCT" | sort)" = "$EXPECTED"
          git diff --exit-code "$BASE" "$PRODUCT" -- sales.html product.html products.html energy.html urea-46.html caustic-soda-solid.html sodium-sulphate-anhydrous.html index.html assets/site.css assets/media/unique-holding-film-720p.mp4 assets/media/unique-holding-caption.vtt
          git checkout --force "$PRODUCT"
          mkdir -p phase12-review/reports
          node scripts/qa-site.mjs | tee phase12-review/reports/qa-site.log
          printf '%s\n' '{"id":"RELEASE-BLOCKER-HTTPS-001","status":"OPEN","note":"CUSTOM DOMAIN HTTPS / Not Secure remains open. DNS, CNAME, GitHub Pages, certificates and HTTPS enforcement were not investigated or modified in Phase 12."}' > phase12-review/reports/release-blocker.json
          python3 - <<'PY' | tee phase12-review/reports/claim-sweep.txt
          from pathlib import Path
          import re
          t=Path('technology.html').read_text()
          main=re.search(r'<main\b[\s\S]*?</main>',t,re.I).group(0)
          phrases=['market leader','industry leader','leading AI','world-class','award-winning','trusted by','used by thousands','customers','enterprise customers','Fortune 500','ARR','MRR','revenue','users','downloads','global offices','proprietary AI','patented','strategic partners','subsidiary','wholly owned','SOC 2','ISO certified']
          hits=[]
          for p in phrases:
              if re.search(r'(?i)(?<![A-Za-z0-9])'+re.escape(p)+r'(?![A-Za-z0-9])',main): hits.append(p)
          print('PHASE 12 CLAIM SWEEP HITS:',len(hits))
          for h in hits: print('-',h)
          if hits: raise SystemExit(1)
          PY
      - name: Prepare browser QA
        run: |
          set -euo pipefail
          node --check /tmp/phase12-browser-qa.cjs
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          npm install --no-save --ignore-scripts puppeteer-core@24.16.0
      - name: Run Phase 12 browser acceptance
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >phase12-review/reports/server.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          OUT_DIR=phase12-review NODE_PATH="$PWD/node_modules" node /tmp/phase12-browser-qa.cjs | tee phase12-review/reports/browser-console.log
      - name: Write review summary
        run: |
          node <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('phase12-review/reports/browser-report.json','utf8'));
          const summary={phase:'12',status:r.failures.length?'FAILED':'READY FOR EXTERNAL REVIEW',baseline:'af0ede75005c121f7eff2dc60ee3d69170cdef5c',newSha:'1ecb43028b3b50b3a44e0b86f0cdef7b671f164f',filesChanged:['assets/technology-content.css','scripts/qa-site.mjs','technology.html'],browser:r.summary,routing:{reference:3,inquiry:62,invalid:0},film:'UNCHANGED — protected Phase 01/Gate A asset, markup, CSS and behavior excluded from Phase 12 diff',phase11:'UNCHANGED — Industrial Sales/RFQ excluded from Phase 12 diff',httpsBlocker:'RELEASE-BLOCKER-HTTPS-001 — OPEN'};
          fs.writeFileSync('phase12-review/reports/summary.json',JSON.stringify(summary,null,2));console.log(JSON.stringify(summary,null,2));if(r.failures.length)process.exit(2);
          NODE
      - name: Upload Phase 12 review packet
        uses: actions/upload-artifact@v4
        with:
          name: phase12-technology-review
          path: phase12-review/
          if-no-files-found: error
