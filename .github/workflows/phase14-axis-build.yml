          cat > docs/qa/phase14-evidence-axis-proof-audit.md <<'MD'
          # Phase 14 — Evidence Axis Corporate Bridge Proof Audit

          Internal QA record. This file documents what may and may not be inferred from the public bridge.

          ## Existing visual audit

          | Element | Source | Public / Private | What it establishes | What it does not establish | Decision |
          | --- | --- | --- | --- | --- | --- |
          | Inherited `.subsite-hero.tech:before` background | Remote Unsplash URL inherited from `assets/internal.css` | PUBLIC REMOTE / provenance not recorded in repo | Decorative technology scene only | Evidence Axis staff, customers, infrastructure or operating proof | UNSAFE AS PROOF — disabled on Evidence Axis bridge |
          | Existing `.feature-image.tech` block | Same remote Unsplash family / provenance not recorded in repo | PUBLIC REMOTE / provenance not recorded in repo | Decorative technology scene only | Specialist research activity, Evidence Axis process or client work | UNSAFE AS PROOF — removed from bridge |

          Phase 14 publishes no screenshot and no raster proof asset. Strong typography and source-backed public links are used instead.

          ## Published proof elements

          | Element | Source | Public / Private | What it establishes | What it does not establish | Safe / Unsafe |
          | --- | --- | --- | --- | --- | --- |
          | Competitive-intelligence / B2B SaaS positioning | Current `https://evidenceaxis.com` public homepage | PUBLIC | Current specialist positioning around competitor discovery, verification and decision-ready intelligence | Market leadership, customer count, platform status, proprietary data or legal structure | SAFE |
          | Research discipline | Current Evidence Axis homepage and public sample | PUBLIC | Human-opened/checked sources; Fact / Inference / Unknown separation; contradictions and unresolved gaps remain visible | A trademarked proprietary methodology, guaranteed accuracy or exclusive data | SAFE |
          | Public Intercom vs Zendesk sample | `https://evidenceaxis.com/sample-report/` | PUBLIC | A demonstration intelligence brief exists; it uses checked first-party sources, evidence states, decision implications and a source register | Client relationship, endorsement, partnership, universal winner or customer proof | SAFE |
          | Public Work destination | `https://evidenceaxis.com/work/` | PUBLIC | A current public Work route exists on the specialist site | Any specific Holding-site client claim; the bridge intentionally does not reproduce engagement details | SAFE |
          | Specialist contact destination | `https://evidenceaxis.com/contact/` | PUBLIC | A current public specialist contact route exists | Response time, commercial terms or engagement outcome | SAFE |

          ## Approved relationship statement

          `Evidence Axis is a specialist venture within the Unique Holding portfolio.`

          This wording is supplied and locked by Phase 14 reviewer authorization. It is a publishable approved portfolio relationship statement, not a public-proof artifact and not a legal-subsidiary conclusion.

          ## Private material exclusion

          Not published and not used as proof:

          - outreach Gifts;
          - prospect-specific decks or appendices;
          - emails;
          - delivery analytics;
          - private reports;
          - internal screenshots;
          - confidential prospect work.

          ## Third-party company boundary

          Intercom and Zendesk appear only because they are the subjects of the current public demonstration sample. They are not represented as customers, clients, partners or endorsers. No logo wall is used.
          MD

          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/qa-site.mjs'); s=p.read_text()
          marker="\nif(errors.length){console.error('\\nTECHNICAL QA FAILED');"
          assert marker in s
          block=r'''

          // Phase 14 — Evidence Axis corporate bridge guards.
          {
            const axis=read('evidence-axis.html');const axisMain=axis.match(/<main\b[\s\S]*?<\/main>/i)?.[0]||'';const axisCss=read('assets/evidence-axis-bridge.css');
            if(!axis.includes('assets/evidence-axis-bridge.css')||!axisCss.startsWith('@layer page{'))errors.push('Phase 14: Evidence Axis bridge stylesheet architecture missing');
            if((axisMain.match(/<h1\b/gi)||[]).length!==1)errors.push('evidence-axis.html: Phase 14 requires exactly one H1');
            for(const token of ['01 / Evidence Axis','SPECIALIST VENTURE','02 / What It Does','03 / Research Discipline','04 / Public Proof','05 / Portfolio Relationship','06 / Continue to Evidence Axis','a specialist venture within the Unique Holding portfolio','View Public Sample','Open EvidenceAxis.com','Intercom vs Zendesk — read as evidence.','Demonstration sample — not a client engagement.','Explanatory sequence based on the current public Evidence Axis research standard'])if(!axisMain.includes(token))errors.push('evidence-axis.html: Phase 14 required bridge token missing -> '+token);
            const forbiddenLegal=[/\blegal subsidiary\b/i,/\bwholly owned subsidiary\b/i,/\bregistered subsidiary\b/i,/\bsubsidiar(?:y|ies)\b/i,/\bdivision\b/i,/\bdepartment\b/i,/\bbusiness unit\b/i,/\bownership percentage\b/i];
            const relationshipNote=axisMain.match(/<p class="axis-relationship-note">[\s\S]*?<\/p>/i)?.[0]||'';const legalScope=axisMain.replace(relationshipNote,'');for(const rx of forbiddenLegal)if(rx.test(legalScope))errors.push('evidence-axis.html: unsupported legal relationship wording -> '+rx);
            const requiredExternal=['https://evidenceaxis.com','https://evidenceaxis.com/sample-report/','https://evidenceaxis.com/work/','https://evidenceaxis.com/contact/'];
            const extTags=[...axisMain.matchAll(/<a\b[^>]*href=["'](https:\/\/evidenceaxis\.com[^"']*)["'][^>]*>/gi)].map(m=>({tag:m[0],href:m[1]}));
            for(const href of requiredExternal)if(!extTags.some(x=>x.href===href))errors.push('evidence-axis.html: required verified Evidence Axis external destination missing -> '+href);
            const allowed=new Set(requiredExternal);for(const x of extTags){if(!allowed.has(x.href))errors.push('evidence-axis.html: unverified Evidence Axis external URL published -> '+x.href);if(attr(x.tag,'target')!=='_blank'||!attr(x.tag,'rel').split(/\s+/).includes('noopener'))errors.push('evidence-axis.html: external Evidence Axis link missing target/rel safety -> '+x.href)}
            if(!axis.includes('<title>Evidence Axis | Competitive Intelligence Venture | Unique Holding</title>'))errors.push('evidence-axis.html: Phase 14 title regression');
