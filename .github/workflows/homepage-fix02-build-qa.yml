name: Homepage Fix 02 Build and QA

on:
  push:
    branches: ["rebuild/award-level-corporate-v2"]

permissions:
  contents: write

jobs:
  build-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/award-level-corporate-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Install image and browser tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick webp libimage-exiftool-perl
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium

      - name: Restore locked baseline and build Centerm asset
        env:
          BASELINE: 46190b02d6760d5c3e59d042535479636c2f2b9a
          SOURCE_URL: https://upload.wikimedia.org/wikipedia/commons/9/9c/Centerm_at_night_as_seen_from_Canada_Place.jpg
          SOURCE_PAGE: https://commons.wikimedia.org/wiki/File:Centerm_at_night_as_seen_from_Canada_Place.jpg
          LICENSE_URL: https://creativecommons.org/licenses/by-sa/4.0/
        run: |
          set -euo pipefail
          git show "$BASELINE:index.html" > index.html
          rm -f assets/homepage-hero-positioning.css
          mkdir -p assets/homepage qa
          curl -L --fail --retry 3 --retry-delay 2 "$SOURCE_URL" -o /tmp/centerm-original.jpg
          identify /tmp/centerm-original.jpg | tee qa/source-identify.txt
          identify assets/phase08/film-still-physical-trade.webp | tee qa/old-identify.txt
          convert /tmp/centerm-original.jpg -auto-orient -resize '2400x1350^' -gravity center -crop 2400x1350+0+0 +repage -unsharp 0x0.65+0.65+0.02 -strip -quality 86 assets/homepage/centerm-night-trade.webp
          exiftool -overwrite_original \
            -XMP-dc:Title='Centerm at night as seen from Canada Place' \
            -XMP-dc:Creator='Dllu' \
            -XMP-dc:Source="$SOURCE_PAGE" \
            -XMP-rights:UsageTerms='CC BY-SA 4.0 — cropped, resized and optimized for Unique Holding homepage' \
            -XMP-cc:License="$LICENSE_URL" \
            assets/homepage/centerm-night-trade.webp
          identify assets/homepage/centerm-night-trade.webp | tee qa/new-identify.txt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<figure class="home-world-media"><img src="assets/phase08/film-still-physical-trade.webp" width="960" height="540" loading="lazy" decoding="async" alt="Illustrative still showing physical trade and logistics handling activity"></figure>'
          new = '<!-- Homepage trade image provenance: "Centerm at night as seen from Canada Place" by Dllu; Own work; CC BY-SA 4.0; cropped/resized/optimized. Source: https://commons.wikimedia.org/wiki/File:Centerm_at_night_as_seen_from_Canada_Place.jpg -->\n      <figure class="home-world-media"><img src="assets/homepage/centerm-night-trade.webp" width="960" height="540" loading="lazy" decoding="async" alt="Illustrative still showing physical trade and logistics handling activity"></figure>'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one baseline trade image tag, found {s.count(old)}')
          s = s.replace(old, new)
          p.write_text(s)
          PY
          printf 'old_bytes=%s\n' "$(stat -c%s assets/phase08/film-still-physical-trade.webp)" | tee qa/file-sizes.txt
          printf 'new_bytes=%s\n' "$(stat -c%s assets/homepage/centerm-night-trade.webp)" | tee -a qa/file-sizes.txt
          sha256sum assets/homepage/centerm-night-trade.webp | tee qa/new-sha256.txt

      - name: Static candidate checks
        env:
          BASELINE: 46190b02d6760d5c3e59d042535479636c2f2b9a
        run: |
          set -euo pipefail
          test "$(grep -o 'assets/homepage/centerm-night-trade.webp' index.html | wc -l)" -eq 1
          test "$(grep -o 'assets/phase08/film-still-physical-trade.webp' index.html | wc -l)" -eq 0
          test ! -e assets/homepage-hero-positioning.css
          cmp energy.html <(git show "$BASELINE:energy.html")
          test "$(git rev-parse "$BASELINE:assets/media/unique-holding-film-720p.mp4")" = "$(git hash-object assets/media/unique-holding-film-720p.mp4)"
          test "$(git rev-parse "$BASELINE:assets/media/unique-holding-caption.vtt")" = "$(git hash-object assets/media/unique-holding-caption.vtt)"
          node scripts/qa-site.mjs | tee qa/qa-site.txt

      - name: Browser QA and screenshots
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/fix02-http.log 2>&1 &
          echo $! >/tmp/fix02-http.pid
          sleep 2
          cat > /tmp/fix02-qa.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const configs = [
              {name:'1920', width:1920, height:1080},
              {name:'1440', width:1440, height:900},
              {name:'390', width:390, height:844},
            ];
            const report = {viewports:{}, failures:[]};
            for (const cfg of configs) {
              const context = await browser.newContext({viewport:{width:cfg.width,height:cfg.height}, deviceScaleFactor:1});
              const page = await context.newPage();
              const consoleErrors=[]; const pageErrors=[]; const failedRequests=[];
              page.on('console', msg => { if (msg.type()==='error') consoleErrors.push(msg.text()); });
              page.on('pageerror', err => pageErrors.push(String(err)));
              page.on('requestfailed', req => failedRequests.push(`${req.method()} ${req.url()} :: ${req.failure()?.errorText || 'failed'}`));
              await page.goto('http://127.0.0.1:8000/index.html', {waitUntil:'networkidle'});
              await page.evaluate(()=>{ const v=document.querySelector('video'); if(v) v.pause(); window.scrollTo(0,0); });
              await page.screenshot({path:`qa/home-${cfg.name}.png`, fullPage:false});
              const section = page.locator('.home-operating-world--trade');
              await section.scrollIntoViewIfNeeded();
              await section.screenshot({path:`qa/energy-${cfg.name}.png`});
              const metrics = await page.evaluate(()=>{
                const img = document.querySelector('.home-operating-world--trade img');
                const section = document.querySelector('.home-operating-world--trade');
                return {
                  horizontalOverflow: document.documentElement.scrollWidth > window.innerWidth + 1,
                  scrollWidth: document.documentElement.scrollWidth,
                  innerWidth: window.innerWidth,
                  imageSrc: img?.getAttribute('src') || null,
                  imageComplete: !!img?.complete,
                  imageNaturalWidth: img?.naturalWidth || 0,
                  imageNaturalHeight: img?.naturalHeight || 0,
                  sectionRect: section ? {x:section.getBoundingClientRect().x,y:section.getBoundingClientRect().y,width:section.getBoundingClientRect().width,height:section.getBoundingClientRect().height} : null,
                };
              });
              report.viewports[cfg.name] = {metrics, consoleErrors, pageErrors, failedRequests};
              if (metrics.horizontalOverflow) report.failures.push(`${cfg.name}: horizontal overflow`);
              if (metrics.imageSrc !== 'assets/homepage/centerm-night-trade.webp') report.failures.push(`${cfg.name}: wrong trade image src ${metrics.imageSrc}`);
              if (!metrics.imageComplete || metrics.imageNaturalWidth !== 2400 || metrics.imageNaturalHeight !== 1350) report.failures.push(`${cfg.name}: trade image not loaded at 2400x1350`);
              if (consoleErrors.length) report.failures.push(`${cfg.name}: console errors: ${consoleErrors.join(' | ')}`);
              if (pageErrors.length) report.failures.push(`${cfg.name}: page errors: ${pageErrors.join(' | ')}`);
              if (failedRequests.length) report.failures.push(`${cfg.name}: failed requests: ${failedRequests.join(' | ')}`);
              await context.close();
            }
            await browser.close();
            fs.writeFileSync('qa/browser-qa.json', JSON.stringify(report,null,2));
            if (report.failures.length) { console.error(report.failures.join('\n')); process.exit(1); }
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/fix02-qa.cjs
          kill "$(cat /tmp/fix02-http.pid)" || true

      - name: Validate final tree against baseline
        env:
          BASELINE: 46190b02d6760d5c3e59d042535479636c2f2b9a
        run: |
          set -euo pipefail
          rm -rf node_modules package.json package-lock.json
          rm -f .github/workflows/homepage-fix02-build-qa.yml
          git add -A
          git diff --cached "$BASELINE" -- index.html > qa/index-diff.txt
          mapfile -t changed < <(git diff --cached --name-only "$BASELINE")
          printf '%s\n' "${changed[@]}" | tee qa/final-changed-files.txt
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'assets/homepage/centerm-night-trade.webp'
          printf '%s\n' "${changed[@]}" | grep -Fx 'index.html'
          test "$(git diff --cached "$BASELINE" --name-only -- energy.html | wc -l)" -eq 0
          test "$(git diff --cached "$BASELINE" --name-only -- assets/media/unique-holding-film-720p.mp4 | wc -l)" -eq 0
          test "$(git diff --cached "$BASELINE" --name-only -- assets/homepage-hero-positioning.css | wc -l)" -eq 0

      - name: Upload QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: homepage-fix02-qa
          path: qa/
          if-no-files-found: error
          retention-days: 14

      - name: Commit final candidate
        env:
          BASELINE: 46190b02d6760d5c3e59d042535479636c2f2b9a
        run: |
          set -euo pipefail
          git reset >/dev/null
          rm -rf qa
          git add -A
          mapfile -t changed < <(git diff --cached --name-only "$BASELINE")
          test "${#changed[@]}" -eq 2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'HOMEPAGE FIX 02 — Replace trade image with Centerm Night'
          git push origin HEAD:rebuild/award-level-corporate-v2
          git rev-parse HEAD
