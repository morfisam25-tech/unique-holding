<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unique Holding | Istanbul</title>
<meta name="theme-color" content="#050607">
<style>
html,body{margin:0;background:#050708;min-height:100%;}
body{font-family:Arial,Helvetica,sans-serif;color:#fff;}
#status{padding:24px;text-align:center;color:#ddd;font-size:14px;}
#home{display:none;width:100%;height:auto;margin:0 auto;}
</style>
</head>
<body>
<div id="status">Loading Unique Holding…</div>
<img id="home" alt="Unique Holding homepage">
<script>
(async function(){
  const status=document.getElementById('status');
  const img=document.getElementById('home');
  try{
    const parts=await Promise.all([1,2,3,4,5].map(async i=>{
      const r=await fetch(`chunks/exact${i}.txt?v=final2`,{cache:'no-store'});
      if(!r.ok) throw new Error(`chunk ${i} (${r.status})`);
      return (await r.text()).trim();
    }));
    img.onload=()=>{status.remove();img.style.display='block';};
    img.onerror=()=>{status.textContent='Image decode failed — please refresh.';};
    img.src='data:image/jpeg;base64,'+parts.join('');
  }catch(e){
    status.textContent='Load failed: '+e.message;
  }
})();
</script>
</body>
</html>
